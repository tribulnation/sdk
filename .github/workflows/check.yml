name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The PoCs are the poc/*.py scripts. The notebooks `sdk-dev poc run` writes beside
      # them hold what each cell printed against a live account, and never reach the repo.
      - name: No PoC notebooks committed
        run: '! git ls-files -- "packages/impl/*.ipynb" | grep .'

      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base="$(git hash-object -t tree /dev/null)"
          fi

          packages=$(git diff --name-only "$base" HEAD | python .github/select_packages.py)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  package:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - id: package
        run: |
          if [ "${{ matrix.package }}" = "sdk" ] || [ "${{ matrix.package }}" = "sdk-dev" ]; then
            echo "path=packages/${{ matrix.package }}/pkg" >> "$GITHUB_OUTPUT"
          else
            echo "path=packages/impl/${{ matrix.package }}/pkg" >> "$GITHUB_OUTPUT"
          fi

      - run: pip install -e packages/sdk/pkg
      # SDK routing and sdk-dev checks import optional implementations and EVM types.
      # Install their real dependencies before checking those imports.
      - if: matrix.package == 'sdk' || matrix.package == 'sdk-dev'
        run: pip install -r requirements.txt
      - if: matrix.package != 'sdk' && matrix.package != 'sdk-dev'
        run: pip install -e ${{ steps.package.outputs.path }}
      - run: pip install ruff pyright build
      - run: ruff check --config ruff.toml ${{ steps.package.outputs.path }}/src
      - run: pyright ${{ steps.package.outputs.path }}
      - run: cp ${{ steps.package.outputs.path }}/../README.md ${{ steps.package.outputs.path }}/../LICENSE ${{ steps.package.outputs.path }}/
      - run: python -m build ${{ steps.package.outputs.path }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -e packages/sdk/pkg
      - run: pip install -e packages/sdk-dev/pkg

      # Validates docs/contract/*.yml, registry.toml and every impl.toml, that every
      # contract method still exists in the source, and that the blocks generated into
      # docs/** are up to date. Ungated by `changes`: its inputs are the docs, the
      # sdk source, every impl.toml and registry.toml, so almost any commit can break it.
      - name: Check docs are in sync
        run: sdk-dev docs check

  unit:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt
      - run: pytest

  release_evidence:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: tribulnation/catalogue
          ref: main
          path: release-catalogue
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install candidate with recorded dependency versions
        run: |
          constraints=()
          for report in release-evidence/*/dependency-pins.txt; do
            if [ -f "$report" ]; then
              constraints+=(-c "$report")
            fi
          done
          pip install "${constraints[@]}" -r requirements.txt
      - name: Verify local evidence without exchange credentials
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: sdk-dev results release "${RELEASE_BRANCH#release/}" --catalogue release-catalogue/data

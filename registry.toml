# The public venue registry: which venues appear in the /sdk site's venue picker and logo
# wall, in what order, under what display name, with which PyPI/icon URLs — mirrors
# typed-dev's own registry.toml (ADR 0016) exactly: hand-authored and trusted outright,
# array order IS display order, never auto-sorted downstream.
#
# This is presentation metadata only — "which venues exist and how do we show them," not
# "what does a given venue's package actually support." That second question is
# packages/impl/<slug>/impl.toml's job, one per package.
#
# icon points at a theme-adaptive SVG on catalogue.tribulnation.com (light/dark handled by
# an embedded `prefers-color-scheme` media query in the SVG itself), same as typed-dev's own
# convention. `name` defaults to slug.capitalize() when omitted.

[[venues]]
slug = "dydx"
name = "dYdX"
tier = "production"
repo = "https://github.com/tribulnationx/sdk"
path = "packages/impl/dydx"
pypi = "https://pypi.org/project/tribulnation-dydx/"
icon = "https://catalogue.tribulnation.com/icons/asset/dydx.svg"


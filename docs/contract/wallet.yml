# Singleton examples deliberately avoid assuming shared asset/network namespaces.
component:
  preamble: |
    from tribulnation.sdk import WalletSDK
    from dotenv import load_dotenv

    load_dotenv()
    wallet = WalletSDK.load('sdk.toml')
  ref: tribulnation.sdk.wallet.sdk:Wallet
  title: Wallet
  tagline: Deposit and withdrawal details — networks, fees, minimums.
  note: "Counts are illustrative, not guaranteed availability or fee quotes. Native asset and network IDs differ by venue. Each example reads only its named account; other configured accounts are untouched."

methods:
  deposit_methods:
    venues:
      bit2me: Reads the native per-asset network list.
      deribit: Public currency metadata; published fees/confirmations are currency-level, not network-specific transaction quotes.
      kucoin: Enabled chains only; withdrawal fees are published per-chain minimums.
    example:
      accountVenues: [binance]
      constants:
        binance: {count: 2}
        bit2me: {count: 2}
        bitget: {count: 2}
        bybit: {count: 2}
        deribit: {count: 2}
        kucoin: {count: 2}
        mexc: {count: 2}
      callTemplate: |
        sdk = wallet.venue('{{ accounts[0] }}')
        async with sdk:
          methods = await sdk.deposit_methods()
        print('{{ accounts[0] }}', len(methods), 'methods')
      resultTemplate: |
        {{ accounts[0] }} {{ constants[accounts[0]].count }} methods

  withdrawal_methods:
    venues:
      bit2me: Requires configured quote_addresses for live proforma fees; only configured destinations are quoted.
      deribit: Public currency metadata; published fees/confirmations are currency-level, not network-specific transaction quotes.
      kucoin: Enabled chains only; withdrawal fees are published per-chain minimums.
      kraken: Native display network names and flat fees. Deposit methods are not implemented.
    example:
      accountVenues: [binance]
      constants:
        binance: {count: 2}
        bit2me: {count: 2}
        bitget: {count: 2}
        bybit: {count: 2}
        deribit: {count: 2}
        kraken: {count: 2}
        kucoin: {count: 2}
        mexc: {count: 2}
      callTemplate: |
        sdk = wallet.venue('{{ accounts[0] }}')
        async with sdk:
          methods = await sdk.withdrawal_methods()
        print('{{ accounts[0] }}', len(methods), 'methods')
      resultTemplate: |
        {{ accounts[0] }} {{ constants[accounts[0]].count }} methods

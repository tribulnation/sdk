# Singleton examples: each script resolves only its rendered account.
component:
  preamble: |
    from tribulnation.sdk import EarnSDK
    from dotenv import load_dotenv

    load_dotenv()
    earn = EarnSDK.load('sdk.toml')
  ref: tribulnation.sdk.earn.sdk:Earn
  title: Earn
  tagline: Yield-bearing instruments across venues, filterable by tag or asset.
  note: "Counts are illustrative, not current availability, APRs or account-eligibility guarantees. Deribit reports trailing reward APRs, not subscribable products. The selected example reads only one configured account."

methods:
  instruments:
    venues:
      deribit: Public trailing seven-day SMA APRs for discovered reward-bearing balances, not subscribable products.
      kraken: Authenticated Earn strategies; published APR ranges are reduced to their midpoint.
      kucoin: Savings, promotions, staking, KCS and ETH staking; structured dual investment is excluded.
    example:
      accountVenues: [binance]
      constants:
        binance: {count: 2}
        bit2me: {count: 2}
        bitget: {count: 2}
        bybit: {count: 2}
        coinbase: {count: 2}
        deribit: {count: 2}
        kraken: {count: 2}
        kucoin: {count: 2}
        mexc: {count: 2}
      callTemplate: |
        sdk = earn.venue('{{ accounts[0] }}')
        async with sdk:
          instruments = await sdk.instruments()
        print('{{ accounts[0] }}', len(instruments), 'instruments')
      resultTemplate: |
        {{ accounts[0] }} {{ constants[accounts[0]].count }} instruments

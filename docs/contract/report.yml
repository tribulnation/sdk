# Singleton examples do not assume shared subaccount or observation shapes.
component:
  preamble: |
    from datetime import datetime, timedelta, timezone
    from tribulnation.sdk import ReportSDK
    from dotenv import load_dotenv

    load_dotenv()
    report = ReportSDK.load('sdk.toml')
    end = datetime.now(timezone.utc)
    start = end - timedelta(days=30)
  ref: tribulnation.sdk.reporting.sdk:Report
  title: Report
  tagline: Historical transactions and current balances/positions, with provenance.
  note: "Counts are illustrative, not completeness or non-empty-account guarantees. Binance and KuCoin reports are spot-side only; other implementations expose different subaccounts and observations. Each script reads only its named account."

methods:
  snapshot:
    venues:
      binance: Spot, Funding and Simple Earn only; no futures compartment.
      kucoin: Classic main/trade and Earn only; futures and legacy margin compartments excluded.
      deribit: Accessible subaccounts; cash balances and signed base-unit positions, not equity-as-cash.
      ethereum: Requires an address and configured data providers; provider settings can be supplied in Python.
    example:
      accountVenues: [hyperliquid]
      constants:
        binance: {subaccounts: 1, balances: 2}
        bit2me: {subaccounts: 1, balances: 2}
        bybit: {subaccounts: 1, balances: 2}
        coinbase: {subaccounts: 1, balances: 2}
        deribit: {subaccounts: 1, balances: 2}
        dydx: {subaccounts: 1, balances: 2}
        ethereum: {subaccounts: 1, balances: 2}
        hyperliquid: {subaccounts: 1, balances: 2}
        kraken: {subaccounts: 1, balances: 2}
        kucoin: {subaccounts: 1, balances: 2}
        mexc: {subaccounts: 1, balances: 2}
      callTemplate: |
        sdk = report.venue('{{ accounts[0] }}')
        async with sdk:
          record = await sdk.snapshot()
        snapshot = record.snapshot
        print('{{ accounts[0] }}', len(snapshot.subaccounts), 'subaccounts',
              len(snapshot.balances), 'balance assets')
      resultTemplate: |
        {{ accounts[0] }} {{ constants[accounts[0]].subaccounts }} subaccounts {{ constants[accounts[0]].balances }} balance assets

  history:
    venues:
      binance: Best-effort spot-side API history; retention, delisted markets and excluded sources may require file ingestion.
      kucoin: Classic spot fills and successful capital events; native retention limits apply.
      dydx: Full older chain history requires an archive provider, not a shorter fallback window.
      ethereum: Requires configured data providers; chain history and interpretation depend on provider/configuration.
      deribit: Transaction-log rows include unknown observations for unsupported trade/settlement interpretations.
    example:
      accountVenues: [hyperliquid]
      constants:
        binance: {count: 2}
        bit2me: {count: 2}
        bybit: {count: 2}
        coinbase: {count: 2}
        deribit: {count: 2}
        dydx: {count: 2}
        ethereum: {count: 2}
        hyperliquid: {count: 2}
        kraken: {count: 2}
        kucoin: {count: 2}
        mexc: {count: 2}
      callTemplate: |
        sdk = report.venue('{{ accounts[0] }}')
        count = 0
        async with sdk:
          async for record in sdk.history(start, end):
            count += 1
        print('{{ accounts[0] }}', count, 'records')
      resultTemplate: |
        {{ accounts[0] }} {{ constants[accounts[0]].count }} records

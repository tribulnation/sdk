        sdk = MarketSDK.load('sdk.toml')

        c = await sdk.collateral('{{ constants[accounts[0]].market_id }}')
      resultTemplate: |
        Collateral(equity=Decimal('{{ constants[accounts[0]].equity }}'), free_collateral=Decimal('{{ constants[accounts[0]].free }}'))
    catalogue:

# Interface contract for MarketSDK. Signatures and docstrings are not written here: `ref`
# names the class, and `sdk-dev` reads each method from the source (sdk_dev.source).
#
# `example`/`catalogue` blocks are Jinja templates (sdk_dev.contract), not literal
# Python — `sdk-dev docs sync` renders each method once per supported venue.
# The wizard selects one venue's complete example, without mixed-subset payloads.
# Every template sees three globals: `accounts` (the venues in this rendering, in
# `accountVenues`' own preferred order — Market's examples are single-market, so they
# just use `accounts[0]`), `constants` (this method's own small per-venue mapping of
# illustrative numbers — a market id, a fake price, a fake order id: no real source to
# compute them from), and `catalogue` (the real, loaded `tribulnation.catalogue.Catalogue` —
# so a translated id is computed, never hand-typed, and can't silently drift from it).
#
# `example.accountVenues`: the venue slug(s) this method's own example was originally
# written against — first in `accounts`' preferred order, and the venues a consumer
# should default the sdk.toml wizard to even before the reader picks anything.
#
# `component.supportedVenues`/`defaultVenues`: NOT declared here — computed by
# `sdk-dev docs sync` (sdk_dev.support) from every packages/impl/*/impl.toml's
# `[support.market]` table. Per-method eligibility comes from `method_universe`,
# not from example availability. Every eligible venue has constants; examples use a supported
# product line without claiming every exchange supports the same methods.
#
# `group`: optional display grouping (Market is the only component with more than a
# handful of methods). Display order follows first-appearance order in this file.
#
# `catalogue`: an optional second call/result pair showing how the `tribulnation-catalogue`
# package resolves this method's raw venue-native strings into canonical cross-venue ids.
# Most methods below show a venue-independent comparison (which raw id does BTC/USDT use
# on mexc vs. okx vs. kraken — venues outside the SDK entirely, verified against the real
# catalogue but not template-computed since they don't depend on `accounts` at all);
# `rules` and `trades_history` instead translate the call's own result, so their
# templates genuinely use `accounts[0]`/`constants`/`catalogue` together.

component:
  preamble: |
    from datetime import datetime, timedelta, timezone
    from decimal import Decimal
    from tribulnation.sdk import MarketSDK
    from dotenv import load_dotenv

    load_dotenv()

    sdk = MarketSDK.load('sdk.toml')
    end = datetime.now(timezone.utc)
    start = end - timedelta(days=1)
  ref: tribulnation.sdk.market.markets:TradingMarkets
  title: Market
  tagline: Order books, rules, orders, positions, funding — for a single instrument.
  # Every example below calls straight off `sdk` (MarketSDK/TradingMarkets) with the
  # full 'account:exchange:market' id — the one mental model a first-time reader needs.
  # Exchange/TradingVenue/Market objects (hold one, skip re-parsing the id on every call)
  # are real and documented, but stay out of this widget on purpose — see
  # reference/market.md's "Object hierarchy" and "Market-ID grammar" sections.
  note: "Examples use illustrative prices, rates and account records, not live observations or release evidence. Replace example order IDs before account reads; order placement changes your account. Exchange-specific limitations still apply. Methods also work on their corresponding scoped objects; see the {reference}."

methods:
  depth:
    group: Public market data
    example:
      accountVenues: [mexc]
      constants:
        mexc: {market_id: 'mexc:spot:BTCUSDT', bid: '60123.00', ask: '60124.10'}
        hyperliquid: {market_id: 'hyperliquid:spot:UBTC/USDC:142', bid: '60095.20', ask: '60096.50'}
        binance: {market_id: 'binance:spot:BTCUSDT', bid: '60123.00', ask: '60124.10'}
        bit2me: {market_id: 'bit2me:spot:BTC/EUR', bid: '60123.00', ask: '60124.10'}
        bitget: {market_id: 'bitget:spot:BTCUSDT', bid: '60123.00', ask: '60124.10'}
        bybit: {market_id: 'bybit:spot:BTCUSDT', bid: '60123.00', ask: '60124.10'}
        coinbase: {market_id: 'coinbase:spot:BTC-USD', bid: '60123.00', ask: '60124.10'}
        dydx: {market_id: 'dydx:perp:BTC-USD', bid: '60123.00', ask: '60124.10'}
        kraken: {market_id: 'kraken:spot:XBTUSD', bid: '60123.00', ask: '60124.10'}
      callTemplate: |
        book = await sdk.depth('{{ constants[accounts[0]].market_id }}', levels=5)
        bid = book.best_bid.price if book.bids else None
        ask = book.best_ask.price if book.asks else None
        print(bid, ask)
      resultTemplate: |
        {{ constants[accounts[0]].bid }} {{ constants[accounts[0]].ask }}
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['mexc', 'okx', 'kraken']:
          for raw_id, info in catalogue.spot_instruments[venue].items():
            if info['base'] == 'bitcoin' and info['quote'] == 'tether':
              print(venue, '->', raw_id)
              break
      resultTemplate: |
        mexc   -> BTCUSDT
        okx    -> BTC-USDT
        kraken -> XBTUSDT

  depth_stream:
    group: Public market data
    example:
      accountVenues: [mexc]
      constants:
        mexc:
          market_id: 'mexc:spot:BTCUSDT'
          ticks:
            - {bid: '60123.40', ask: '60124.00'}
            - {bid: '60123.50', ask: '60124.00'}
            - {bid: '60122.90', ask: '60123.60'}
            - {bid: '60123.10', ask: '60123.90'}
        hyperliquid:
          market_id: 'hyperliquid:spot:UBTC/USDC:142'
          ticks:
            - {bid: '60095.60', ask: '60096.20'}
            - {bid: '60095.70', ask: '60096.20'}
            - {bid: '60095.10', ask: '60095.80'}
            - {bid: '60095.30', ask: '60096.10'}
        bybit: {market_id: 'bybit:spot:BTCUSDT', ticks: [{bid: '60123.40', ask: '60124.00'}, {bid: '60123.50', ask: '60124.00'}, {bid: '60122.90', ask: '60123.60'}, {bid: '60123.10', ask: '60123.90'}]}
        binance: {market_id: 'binance:spot:BTCUSDT', ticks: [{bid: '60123.40', ask: '60124.00'}, {bid: '60123.50', ask: '60124.00'}, {bid: '60122.90', ask: '60123.60'}, {bid: '60123.10', ask: '60123.90'}]}
        bit2me: {market_id: 'bit2me:spot:BTC/EUR', ticks: [{bid: '60123.40', ask: '60124.00'}, {bid: '60123.50', ask: '60124.00'}, {bid: '60122.90', ask: '60123.60'}, {bid: '60123.10', ask: '60123.90'}]}
        bitget: {market_id: 'bitget:spot:BTCUSDT', ticks: [{bid: '60123.40', ask: '60124.00'}, {bid: '60123.50', ask: '60124.00'}, {bid: '60122.90', ask: '60123.60'}, {bid: '60123.10', ask: '60123.90'}]}
        coinbase: {market_id: 'coinbase:spot:BTC-USD', ticks: [{bid: '60123.40', ask: '60124.00'}, {bid: '60123.50', ask: '60124.00'}, {bid: '60122.90', ask: '60123.60'}, {bid: '60123.10', ask: '60123.90'}]}
        dydx: {market_id: 'dydx:perp:BTC-USD', ticks: [{bid: '60123.40', ask: '60124.00'}, {bid: '60123.50', ask: '60124.00'}, {bid: '60122.90', ask: '60123.60'}, {bid: '60123.10', ask: '60123.90'}]}
        kraken: {market_id: 'kraken:spot:XBTUSD', ticks: [{bid: '60123.40', ask: '60124.00'}, {bid: '60123.50', ask: '60124.00'}, {bid: '60122.90', ask: '60123.60'}, {bid: '60123.10', ask: '60123.90'}]}
      callTemplate: |
        async with sdk.depth_stream('{{ constants[accounts[0]].market_id }}') as books:
          async for book in books:
            bid = book.best_bid.price if book.bids else None
            ask = book.best_ask.price if book.asks else None
            print(bid, ask)
      resultTemplate: |
        {% for t in constants[accounts[0]].ticks %}
        {{ t.bid }} {{ t.ask }}

        {% endfor %}
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['mexc', 'okx', 'kraken']:
          for raw_id, info in catalogue.spot_instruments[venue].items():
            if info['base'] == 'bitcoin' and info['quote'] == 'tether':
              print(venue, '->', raw_id)
              break
      resultTemplate: |
        mexc   -> BTCUSDT
        okx    -> BTC-USDT
        kraken -> XBTUSDT

  rules:
    group: Public market data
    # Asset identity comes from the Catalogue; rules contain trading constraints.
    example:
      accountVenues: [mexc]
      constants:
        mexc:
          market_id: 'mexc:spot:BTCUSDT'
          instrument_id: BTCUSDT
          fee_asset: USDT
          tick_size: '0.10'
          step_size: '0.00001'
        hyperliquid:
          market_id: 'hyperliquid:spot:UBTC/USDC:142'
          instrument_id: 'UBTC/USDC:142'
          fee_asset: '0'
          tick_size: '0.001'
          step_size: '0.00001'
        bitget: {market_id: 'bitget:spot:BTCUSDT', instrument_id: 'BTCUSDT', fee_asset: 'USDT', tick_size: '0.10', step_size: '0.00001', kind: 'spot'}
        kraken: {market_id: 'kraken:spot:XBTUSD', instrument_id: 'XBTUSD', fee_asset: 'ZUSD', tick_size: '0.10', step_size: '0.00001', kind: 'spot'}
        binance: {market_id: 'binance:spot:BTCUSDT', instrument_id: 'BTCUSDT', fee_asset: 'USDT', tick_size: '0.10', step_size: '0.00001'}
        bit2me: {market_id: 'bit2me:spot:BTC/EUR', instrument_id: 'BTC/EUR', fee_asset: 'EUR', tick_size: '0.10', step_size: '0.00001'}
        bybit: {market_id: 'bybit:spot:BTCUSDT', instrument_id: 'BTCUSDT', fee_asset: 'USDT', tick_size: '0.10', step_size: '0.00001'}
        coinbase: {market_id: 'coinbase:spot:BTC-USD', instrument_id: 'BTC-USD', fee_asset: 'USD', tick_size: '0.10', step_size: '0.00001'}
        dydx: {market_id: 'dydx:perp:BTC-USD', instrument_id: 'BTC-USD', fee_asset: 'USDC', tick_size: '0.10', step_size: '0.00001'}
      callTemplate: |
        rules = await sdk.rules('{{ constants[accounts[0]].market_id }}')
        price = rules.round_price(Decimal('60123.456'))
        print(rules.tick_size, rules.step_size)
      resultTemplate: |
        {{ constants[accounts[0]].tick_size }} {{ constants[accounts[0]].step_size }}
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        instruments = catalogue.{{ 'perpetual' if accounts[0] == 'dydx' else 'spot' }}_instruments
        instrument = instruments.get('{{ accounts[0] }}', {}).get('{{ constants[accounts[0]].instrument_id }}')
        if instrument is None:
          print('Not yet catalogued')
        else:
          print(instrument['base'], '/', instrument['quote'])
      resultTemplate: |
        {% set instruments = catalogue.perpetual_instruments if accounts[0] == 'dydx' else catalogue.spot_instruments %}
        {% set instrument = instruments.get(accounts[0], {}).get(constants[accounts[0]].instrument_id) %}
        {% if instrument %}
        {{ instrument.base }} / {{ instrument.quote }}
        {% else %}
        Not yet catalogued
        {% endif %}

  fees:
    group: Account trading data
    public: false
    venues:
      binance: Combined spot standard/tax/special commissions; USD-M ordinary-order rates. Optional BNB payment discounts and RPI orders excluded.
      bitget: Symbol-scoped Classic or UTA account rates.
      bybit: Symbol-scoped account rates, including the account's applicable fee tier.
      coinbase: INTX only; cost-plus and unresolved GST adjustments are unsupported. Spot pricing remains unsupported.
      dydx: Account tier, market fee holidays and staking adjustments with protocol rounding.
      hyperliquid: Native USDC perpetuals only; HIP-3 and spot require additional verified fee metadata.
      kraken: Account TradeVolume schedule, converted from percent to fractions.
      mexc: Spot only with MX deduction disabled; personal perpetual fees are unsupported.
    example:
      accountVenues: [binance]
      constants:
        binance: {market_id: 'binance:spot:BTCUSDT'}
        coinbase: {market_id: 'coinbase:intx:BTC-PERP-INTX'}
        hyperliquid: {market_id: 'hyperliquid::BTC'}
        kraken: {market_id: 'kraken:spot:XBTUSD'}
        bitget: {market_id: 'bitget:spot:BTCUSDT'}
        bybit: {market_id: 'bybit:spot:BTCUSDT'}
        dydx: {market_id: 'dydx:perp:BTC-USD'}
        mexc: {market_id: 'mexc:spot:BTCUSDT'}
      callTemplate: |
        fees = await sdk.fees('{{ constants[accounts[0]].market_id }}')
        print(fees.taker_buy, fees.taker_sell)
      resultTemplate: |
        Decimal('0.001') Decimal('0.001')

  candles:
    group: Public market data
    venues:
      binance: Spot and USD-M, every contract interval, 1000 per page with `[start, end)` filtering.
      bit2me: Bounded windows continue through empty slots; no synthetic candles. Native order, JSON-number prices converted to decimals.
      hyperliquid: Spot and perpetuals in native order. Only the latest 5000 candles per interval are retained by the venue; quote volume is not reported.
      bybit: Native newest-first pages, filtered to required `[start, end)` bounds without buffering the full history.
      coinbase: "Required `[start, end)` bounds, swept in windows of 299 candle opens because the venue caps each range. Native row order; `quote_volume` is `None`, and hours with no trades are absent rather than zero."
      dydx: Native newest-first pages, filtered to required `[start, end)` bounds without buffering the full history.
      mexc: "Required `[start, end)` bounds. Pages of 500, the cap MEXC really serves."
      bitget: Spot and supported perpetual exchanges; required aware half-open bounds. Native page order, no synthetic rows.
      kraken: Spot only. Venue retention is the latest 720 candles per interval; older windows cannot be reconstructed by paging.
    example:
      accountVenues: [mexc]
      constants:
        mexc: {market_id: 'mexc:spot:BTCUSDT', open1: '60123.40', close1: '60150.00', open2: '60150.00', close2: '60098.20'}
        binance: {market_id: 'binance:spot:BTCUSDT', open1: '60124.10', close1: '60151.30', open2: '60151.30', close2: '60099.00'}
        bybit: {market_id: 'bybit:spot:BTCUSDT', open1: '60122.80', close1: '60149.50', open2: '60149.50', close2: '60097.60'}
        coinbase: {market_id: 'coinbase:spot:BTC-USD', open1: '60120.55', close1: '60148.02', open2: '60148.02', close2: '60096.11'}
        dydx: {market_id: 'dydx:perp:BTC-USD', open1: '60118.00', close1: '60146.00', open2: '60146.00', close2: '60094.00'}
        bit2me: {market_id: 'bit2me:spot:BTC/EUR', open1: '60123.40', close1: '60150.00', open2: '60150.00', close2: '60098.20'}
        bitget: {market_id: 'bitget:spot:BTCUSDT', open1: '60123.40', close1: '60150.00', open2: '60150.00', close2: '60098.20'}
        hyperliquid: {market_id: 'hyperliquid:spot:UBTC/USDC:142', open1: '60123.40', close1: '60150.00', open2: '60150.00', close2: '60098.20'}
        kraken: {market_id: 'kraken:spot:XBTUSD', open1: '60123.40', close1: '60150.00', open2: '60150.00', close2: '60098.20'}
      callTemplate: |
        async for page in sdk.candles('{{ constants[accounts[0]].market_id }}', '1h', start, end):
          for candle in page:
            print(candle.time, candle.open, candle.close)
      resultTemplate: |
        2025-01-03 08:00:00+00:00 {{ constants[accounts[0]].open1 }} {{ constants[accounts[0]].close1 }}
        2025-01-03 09:00:00+00:00 {{ constants[accounts[0]].open2 }} {{ constants[accounts[0]].close2 }}
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['mexc', 'okx', 'kraken']:
          for raw_id, info in catalogue.spot_instruments[venue].items():
            if info['base'] == 'bitcoin' and info['quote'] == 'tether':
              print(venue, '->', raw_id)
              break
      resultTemplate: |
        mexc   -> BTCUSDT
        okx    -> BTC-USDT
        kraken -> XBTUSDT

  tickers:
    group: Bulk market data
    example:
      accountVenues: [mexc]
      # Exchange-level id (no market segment) — this method is defined on Exchange, not a
      # single Market, per docs/market/index.md's grammar table.
      constants:
        mexc:
          exchange_id: 'mexc:spot'
          markets:
            - {key: BTCUSDT, last: '60123.40', bid: '60123.00', ask: '60124.10'}
            - {key: ETHUSDT, last: '3210.50', bid: '3210.20', ask: '3210.80'}
        hyperliquid:
          exchange_id: 'hyperliquid:spot'
          markets:
            - {key: 'UBTC/USDC:142', last: '60095.90', bid: '60095.20', ask: '60096.50'}
        coinbase: {exchange_id: 'coinbase:spot', markets: [{key: 'BTC-USD', last: '60123.40', bid: '60123.00', ask: '60124.10'}]}
        binance: {exchange_id: 'binance:spot', markets: [{key: 'BTCUSDT', last: '60123.40', bid: '60123.00', ask: '60124.10'}]}
        bit2me: {exchange_id: 'bit2me:spot', markets: [{key: 'BTC/EUR', last: '60123.40', bid: '60123.00', ask: '60124.10'}]}
        bitget: {exchange_id: 'bitget:spot', markets: [{key: 'BTCUSDT', last: '60123.40', bid: '60123.00', ask: '60124.10'}]}
        bybit: {exchange_id: 'bybit:spot', markets: [{key: 'BTCUSDT', last: '60123.40', bid: '60123.00', ask: '60124.10'}]}
        dydx: {exchange_id: 'dydx:perp', markets: [{key: 'BTC-USD', last: '60123.40', bid: '60123.00', ask: '60124.10'}]}
        kraken: {exchange_id: 'kraken:spot', markets: [{key: 'XBTUSD', last: '60123.40', bid: '60123.00', ask: '60124.10'}]}
      callTemplate: |
        snapshot = await sdk.tickers('{{ constants[accounts[0]].exchange_id }}')
      resultTemplate: |
        {% for m in constants[accounts[0]].markets %}
        '{{ m.key }}': Ticker(last=Decimal('{{ m.last }}'), bid=Decimal('{{ m.bid }}'), ask=Decimal('{{ m.ask }}')),
        {% endfor %}
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['mexc', 'okx', 'kraken']:
          for raw_id, info in catalogue.spot_instruments[venue].items():
            if info['base'] == 'bitcoin' and info['quote'] == 'tether':
              print(venue, '->', raw_id)
              break
      resultTemplate: |
        mexc   -> BTCUSDT
        okx    -> BTC-USDT
        kraken -> XBTUSDT

  perp_stats:
    group: Bulk market data
    venues:
      dydx: Fetched for the whole universe in one request.
      hyperliquid: Fetched for the whole universe in one request.
      binance: USD-M perpetuals; bulk price/funding plus per-market open-interest reads. Component observations are not atomic.
      bitget: USDT, USDC and Classic coin-margined perpetuals. UTA coin is unsupported.
      bybit: Linear perpetuals only.
      coinbase: INTX perpetuals, not domestic dated futures; authenticated product catalogue reads.
      mexc: Public perpetual metadata; account-specific futures permissions are not needed for this method.
    example:
      accountVenues: [dydx]
      # Exchange-level id — same reasoning as tickers' constants above. Hyperliquid's
      # default perp DEX has an empty exchange_id (docs/market/index.md:54), so its
      # exchange-level id is a bare trailing colon: 'hyperliquid:'.
      constants:
        dydx:
          exchange_id: 'dydx:perp'
          key: BTC-USD
          index: '60120.00'
          mark: '60125.50'
          funding: '0.0001'
          open_interest: '812.4'
        hyperliquid:
          exchange_id: 'hyperliquid:'
          key: BTC
          index: '60110.50'
          mark: '60116.00'
          funding: '0.00012'
          open_interest: '634.9'
        binance: {exchange_id: 'binance:usdm', key: 'BTCUSDT', index: '60120.00', mark: '60125.50', funding: '0.0001', open_interest: '812.4'}
        bitget: {exchange_id: 'bitget:usdt', key: 'BTCUSDT', index: '60120.00', mark: '60125.50', funding: '0.0001', open_interest: '812.4'}
        bybit: {exchange_id: 'bybit:perp', key: 'BTCUSDT', index: '60120.00', mark: '60125.50', funding: '0.0001', open_interest: '812.4'}
        coinbase: {exchange_id: 'coinbase:intx', key: 'BTC-PERP-INTX', index: '60120.00', mark: '60125.50', funding: '0.0001', open_interest: '812.4'}
        mexc: {exchange_id: 'mexc:perp', key: 'BTC_USDT', index: '60120.00', mark: '60125.50', funding: '0.0001', open_interest: '812.4'}
      callTemplate: |
        stats = await sdk.perp_stats('{{ constants[accounts[0]].exchange_id }}')
      resultTemplate: |
        {'{{ constants[accounts[0]].key }}': PerpStats(index=Decimal('{{ constants[accounts[0]].index }}'), mark=Decimal('{{ constants[accounts[0]].mark }}'),
                               funding=Decimal('{{ constants[accounts[0]].funding }}'), open_interest=Decimal('{{ constants[accounts[0]].open_interest }}'))}
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['dydx', 'hyperliquid']:
          for raw_id, info in catalogue.perpetual_instruments[venue].items():
            if info['base'] == 'bitcoin':
              market_id = f'dydx:perp:{raw_id}' if venue == 'dydx' else f'hyperliquid::{raw_id}'
              print(venue, '->', market_id)
              break
      resultTemplate: |
        dydx -> dydx:perp:BTC-USD
        hyperliquid -> hyperliquid::BTC

  query_order:
    group: Your account data
    venues:
      dydx: Overrides the base scan and can return filled and canceled states too.
    public: false
    example:
      accountVenues: [mexc]
      constants:
        mexc: {market_id: 'mexc:spot:BTCUSDT', order_id: '4834937', price: '59500', qty: '0.01'}
        hyperliquid: {market_id: 'hyperliquid:spot:UBTC/USDC:142', order_id: '184920371', price: '59480', qty: '0.02'}
        binance: {market_id: 'binance:spot:BTCUSDT', order_id: '4834937', price: '59500', qty: '0.01'}
        bit2me: {market_id: 'bit2me:spot:BTC/EUR', order_id: '00000000-0000-4000-8000-000000000001', price: '59500', qty: '0.01'}
        bitget: {market_id: 'bitget:spot:BTCUSDT', order_id: '4834937', price: '59500', qty: '0.01'}
        bybit: {market_id: 'bybit:spot:BTCUSDT', order_id: '00000000-0000-4000-8000-000000000001', price: '59500', qty: '0.01'}
        coinbase: {market_id: 'coinbase:spot:BTC-USD', order_id: '00000000-0000-4000-8000-000000000001', price: '59500', qty: '0.01'}
        dydx: {market_id: 'dydx:perp:BTC-USD', order_id: 'Ci0KK2R5ZHgxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXE2NndtODIVAQAAABhA', price: '59500', qty: '0.01'}
        kraken: {market_id: 'kraken:spot:XBTUSD', order_id: 'OABC12-DE345-FGHI61', price: '59500', qty: '0.01'}
      callTemplate: |

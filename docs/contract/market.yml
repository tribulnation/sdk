# Interface contract for MarketSDK — every signature/description here is checked
# against the real source at authoring time, not the other way around.
#
# `example`/`catalogue` blocks are Jinja templates (sdk_dev.contract), not literal
# Python — `sdk-dev docs sync` renders each method once per reachable non-empty subset
# of the venues it can genuinely be called against, so the wizard always shows a script
# and result that match whatever the reader picked, instead of one hardcoded venue.
# Every template sees three globals: `accounts` (the venues in this rendering, in
# `accountVenues`' own preferred order — Market's examples are single-market, so they
# just use `accounts[0]`), `constants` (this method's own small per-venue mapping of
# illustrative numbers — a market id, a fake price, a fake order id: no real source to
# compute them from), and `catalogue` (the real, loaded `tribulnation.catalogue.Catalogue` —
# so a translated id is computed, never hand-typed, and can't silently drift from it).
#
# `example.accountVenues`: the venue slug(s) this method's own example was originally
# written against — first in `accounts`' preferred order, and the venues a consumer
# should default the sdk.toml wizard to even before the reader picks anything.
#
# `component.supportedVenues`/`defaultVenues`: NOT declared here — computed by
# `sdk-dev docs sync` (sdk_dev.support) from every packages/impl/*/impl.toml's
# `[support.market]` table. Per-method venue eligibility narrows that further to
# whichever of those venues this method's own `constants` covers (sdk_dev.support's
# `method_universe` ∩ `example.constants.keys()`) — e.g. no perp method below declares
# `constants.mexc` (mexc has no perp markets), so mexc never appears in a perp method's
# picker even though mexc/impl.toml grants `[support.market]` in general.
#
# `group`: optional display grouping (Market is the only component with more than a
# handful of methods). Display order follows first-appearance order in this file.
#
# `catalogue`: an optional second call/result pair showing how the `tribulnation-catalogue`
# package resolves this method's raw venue-native strings into canonical cross-venue ids.
# Most methods below show a venue-independent comparison (which raw id does BTC/USDT use
# on mexc vs. okx vs. kraken — venues outside the SDK entirely, verified against the real
# catalogue but not template-computed since they don't depend on `accounts` at all);
# `rules` and `trades_history` instead translate the call's own result, so their
# templates genuinely use `accounts[0]`/`constants`/`catalogue` together.

component:
  title: Market
  tagline: Order books, rules, orders, positions, funding — for a single instrument.
  # Every example below calls straight off `sdk` (MarketSDK/TradingMarkets) with the
  # full 'account:exchange:market' id — the one mental model a first-time reader needs.
  # Exchange/TradingVenue/Market objects (hold one, skip re-parsing the id on every call)
  # are real and documented, but stay out of this widget on purpose — see
  # reference/market.md's "Object hierarchy" and "Market-ID grammar" sections.
  note: "Every method below also works scoped to a venue, exchange, or single market object once you're holding one — same call, less id to repeat. Full picture in the {reference}."

methods:
  depth:
    group: Public market data
    signature: "depth(id, *, levels=None) -> Book"
    description: The order book — bids and asks, best first.
    example:
      accountVenues: [mexc]
      constants:
        mexc: {market_id: 'mexc:spot:BTCUSDT', bid: '60123.00', ask: '60124.10'}
        hyperliquid: {market_id: 'hyperliquid:spot:UBTC/USDC:142', bid: '60095.20', ask: '60096.50'}
      callTemplate: |
        from tribulnation.sdk import MarketSDK
        from dotenv import load_dotenv

        load_dotenv()

        sdk = MarketSDK.load('sdk.toml')

        book = await sdk.depth('{{ constants[accounts[0]].market_id }}', levels=5)
        print(book.best_bid, book.best_ask)
      resultTemplate: |
        (Decimal('{{ constants[accounts[0]].bid }}'), Decimal('{{ constants[accounts[0]].ask }}'))
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['mexc', 'okx', 'kraken']:
          for raw_id, info in catalogue.spot_instruments[venue].items():
            if info['base'] == 'bitcoin' and info['quote'] == 'tether':
              print(venue, '->', raw_id)
              break
      resultTemplate: |
        mexc   -> BTCUSDT
        okx    -> BTC-USDT
        kraken -> XBTUSDT

  depth_stream:
    group: Public market data
    signature: "depth_stream(id, *, levels=None, queue_size=1, overflow='latest') -> AsyncContextManager[AsyncIterable[Book]]"
    description: Subscribe to live order books — a bounded, overflow-aware stream.
    example:
      accountVenues: [mexc]
      constants:
        mexc:
          market_id: 'mexc:spot:BTCUSDT'
          ticks:
            - {bid: '60123.40', ask: '60124.00'}
            - {bid: '60123.50', ask: '60124.00'}
            - {bid: '60122.90', ask: '60123.60'}
            - {bid: '60123.10', ask: '60123.90'}
        hyperliquid:
          market_id: 'hyperliquid:spot:UBTC/USDC:142'
          ticks:
            - {bid: '60095.60', ask: '60096.20'}
            - {bid: '60095.70', ask: '60096.20'}
            - {bid: '60095.10', ask: '60095.80'}
            - {bid: '60095.30', ask: '60096.10'}
      callTemplate: |
        from tribulnation.sdk import MarketSDK
        from dotenv import load_dotenv

        load_dotenv()

        sdk = MarketSDK.load('sdk.toml')

        async with sdk.depth_stream('{{ constants[accounts[0]].market_id }}') as books:
          async for book in books:
            print(book.best_bid, book.best_ask)
      resultTemplate: |
        {% for t in constants[accounts[0]].ticks %}
        (Decimal('{{ t.bid }}'), Decimal('{{ t.ask }}'))

        {% endfor %}
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['mexc', 'okx', 'kraken']:
          for raw_id, info in catalogue.spot_instruments[venue].items():
            if info['base'] == 'bitcoin' and info['quote'] == 'tether':
              print(venue, '->', raw_id)
              break
      resultTemplate: |
        mexc   -> BTCUSDT
        okx    -> BTC-USDT
        kraken -> XBTUSDT

  rules:
    group: Public market data
    signature: "rules(id, *, refetch=False) -> Rules"
    description: Tick/step size, fees, min/max, and rounding helpers — cached after the first call.
    # Hyperliquid's spot Rules.base/.quote/.fee_asset used to come back as raw SYMBOL
    # NAMES ('UBTC', 'USDC' — confirmed real pair, not 'BTC': the catalogue's own
    # data/instruments/spot/hyperliquid.json keys the real BTC/USDC pair
    # 'UBTC/USDC:142'), which didn't match catalogue.asset_translations['hyperliquid']
    # (numeric-token-index keyed, e.g. '197'->'bitcoin' — the form wallet/report already
    # used for this same venue). Fixed at the source instead of papering over it here:
    # packages/impl/hyperliquid/.../market/impl/spot_rules.py now resolves base/quote/
    # fee_asset to the same numeric index report/history/assets.py already used, via a
    # new Shared.resolve_asset_index() (mixin.py) — so `constants.hyperliquid.base`/`.quote`
    # below (index-keyed) genuinely resolve through `catalogue.asset_translations`, no
    # catalogue changes needed. tick_size/step_size are genuinely computed from a live
    # szDecimals value and maker_fee/taker_fee genuinely come from a live API call in
    # that same impl file — no static example exists anywhere to quote, so the numbers
    # below are illustrative, exactly as illustrative as every other Decimal in this file.
    example:
      accountVenues: [mexc]
      constants:
        mexc:
          market_id: 'mexc:spot:BTCUSDT'
          base: BTC
          quote: USDT
          tick_size: '0.10'
          step_size: '0.00001'
          maker_fee: '0.0002'
          taker_fee: '0.0004'
        hyperliquid:
          market_id: 'hyperliquid:spot:UBTC/USDC:142'
          base: '197'
          quote: '0'
          tick_size: '0.001'
          step_size: '0.00001'
          maker_fee: '0.0002'
          taker_fee: '0.00035'
      callTemplate: |
        from tribulnation.sdk import MarketSDK
        from dotenv import load_dotenv

        load_dotenv()

        sdk = MarketSDK.load('sdk.toml')

        rules = await sdk.rules('{{ constants[accounts[0]].market_id }}')
        price = rules.round_price(60123.456)
      resultTemplate: |
        Rules(
          base='{{ constants[accounts[0]].base }}', quote='{{ constants[accounts[0]].quote }}',
          tick_size=Decimal('{{ constants[accounts[0]].tick_size }}'), step_size=Decimal('{{ constants[accounts[0]].step_size }}'),
          maker_fee=Decimal('{{ constants[accounts[0]].maker_fee }}'), taker_fee=Decimal('{{ constants[accounts[0]].taker_fee }}'),
        )
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        base_id = catalogue.asset_translations['{{ accounts[0] }}'][rules.base]
        quote_id = catalogue.asset_translations['{{ accounts[0] }}'][rules.quote]
        print(base_id, '/', quote_id)
      resultTemplate: |
        {{ catalogue.asset_translations[accounts[0]][constants[accounts[0]].base] }} / {{ catalogue.asset_translations[accounts[0]][constants[accounts[0]].quote] }}

  tickers:
    group: Bulk market data
    signature: "tickers(id, markets=None) -> Mapping[str, Ticker]"
    description: Top-of-book snapshot for every market on this exchange, in one bulk call — defined on Exchange, not a single Market.
    example:
      accountVenues: [mexc]
      # Exchange-level id (no market segment) — this method is defined on Exchange, not a
      # single Market, per docs/market/index.md's grammar table.
      constants:
        mexc:
          exchange_id: 'mexc:spot'
          markets:
            - {key: BTCUSDT, last: '60123.40', bid: '60123.00', ask: '60124.10'}
            - {key: ETHUSDT, last: '3210.50', bid: '3210.20', ask: '3210.80'}
        hyperliquid:
          exchange_id: 'hyperliquid:spot'
          markets:
            - {key: 'UBTC/USDC:142', last: '60095.90', bid: '60095.20', ask: '60096.50'}
      callTemplate: |
        from tribulnation.sdk import MarketSDK
        from dotenv import load_dotenv

        load_dotenv()

        sdk = MarketSDK.load('sdk.toml')

        snapshot = await sdk.tickers('{{ constants[accounts[0]].exchange_id }}')
      resultTemplate: |
        {% for m in constants[accounts[0]].markets %}
        '{{ m.key }}': Ticker(last=Decimal('{{ m.last }}'), bid=Decimal('{{ m.bid }}'), ask=Decimal('{{ m.ask }}')),
        {% endfor %}
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['mexc', 'okx', 'kraken']:
          for raw_id, info in catalogue.spot_instruments[venue].items():
            if info['base'] == 'bitcoin' and info['quote'] == 'tether':
              print(venue, '->', raw_id)
              break
      resultTemplate: |
        mexc   -> BTCUSDT
        okx    -> BTC-USDT
        kraken -> XBTUSDT

  perp_stats:
    group: Bulk market data
    signature: "perp_stats(id, markets=None) -> Mapping[str, PerpStats]"
    description: Index/mark price, predicted funding, and open interest for every perp market — one consistent cross-section, not a per-market loop.
    example:
      accountVenues: [dydx]
      # Exchange-level id — same reasoning as tickers' constants above. Hyperliquid's
      # default perp DEX has an empty exchange_id (docs/market/index.md:54), so its
      # exchange-level id is a bare trailing colon: 'hyperliquid:'.
      constants:
        dydx:
          exchange_id: 'dydx:perp'
          key: BTC-USD
          index: '60120.00'
          mark: '60125.50'
          funding: '0.0001'
          open_interest: '812.4'
        hyperliquid:
          exchange_id: 'hyperliquid:'
          key: BTC
          index: '60110.50'
          mark: '60116.00'
          funding: '0.00012'
          open_interest: '634.9'
      callTemplate: |
        from tribulnation.sdk import MarketSDK
        from dotenv import load_dotenv

        load_dotenv()

        sdk = MarketSDK.load('sdk.toml')

        stats = await sdk.perp_stats('{{ constants[accounts[0]].exchange_id }}')
      resultTemplate: |
        {'{{ constants[accounts[0]].key }}': PerpStats(index=Decimal('{{ constants[accounts[0]].index }}'), mark=Decimal('{{ constants[accounts[0]].mark }}'),
                               funding=Decimal('{{ constants[accounts[0]].funding }}'), open_interest=Decimal('{{ constants[accounts[0]].open_interest }}'))}
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['dydx', 'hyperliquid']:
          for raw_id, info in catalogue.perpetual_instruments[venue].items():
            if info['base'] == 'bitcoin':
              market_id = f'dydx:perp:{raw_id}' if venue == 'dydx' else f'hyperliquid::{raw_id}'
              print(venue, '->', market_id)
              break
      resultTemplate: |
        dydx -> dydx:perp:BTC-USD
        hyperliquid -> hyperliquid::BTC

  query_order:
    group: Your account data
    signature: "query_order(id, order_id) -> OrderState | None"
    description: State of one order by id. The base implementation only finds open orders unless the venue overrides it.
    public: false
    example:
      accountVenues: [mexc]
      constants:
        mexc: {market_id: 'mexc:spot:BTCUSDT', order_id: '4834937', price: '59500', qty: '0.01'}
        hyperliquid: {market_id: 'hyperliquid:spot:UBTC/USDC:142', order_id: '184920371', price: '59480', qty: '0.02'}
      callTemplate: |
        from tribulnation.sdk import MarketSDK
        from dotenv import load_dotenv

        load_dotenv()

        sdk = MarketSDK.load('sdk.toml')

        state = await sdk.query_order('{{ constants[accounts[0]].market_id }}', '{{ constants[accounts[0]].order_id }}')
      resultTemplate: |
        OrderState(id='{{ constants[accounts[0]].order_id }}', price=Decimal('{{ constants[accounts[0]].price }}'), qty=Decimal('{{ constants[accounts[0]].qty }}'),
                   filled_qty=Decimal('0'), active=True)
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['mexc', 'okx', 'kraken']:
          for raw_id, info in catalogue.spot_instruments[venue].items():
            if info['base'] == 'bitcoin' and info['quote'] == 'tether':
              print(venue, '->', raw_id)
              break
      resultTemplate: |
        mexc   -> BTCUSDT
        okx    -> BTC-USDT
        kraken -> XBTUSDT

  open_orders:
    group: Your account data
    signature: "open_orders(id) -> Sequence[OrderState]"
    description: Your currently-open orders on this market.
    public: false
    example:
      accountVenues: [mexc]
      constants:
        mexc: {market_id: 'mexc:spot:BTCUSDT', order_id: '4834937', price: '59500', qty: '0.01'}
        hyperliquid: {market_id: 'hyperliquid:spot:UBTC/USDC:142', order_id: '184920371', price: '59480', qty: '0.02'}
      callTemplate: |
        from tribulnation.sdk import MarketSDK
        from dotenv import load_dotenv

        load_dotenv()

        sdk = MarketSDK.load('sdk.toml')

        orders = await sdk.open_orders('{{ constants[accounts[0]].market_id }}')
      resultTemplate: |
        [OrderState(id='{{ constants[accounts[0]].order_id }}', price=Decimal('{{ constants[accounts[0]].price }}'),
                     qty=Decimal('{{ constants[accounts[0]].qty }}'), filled_qty=Decimal('0'), active=True)]
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['mexc', 'okx', 'kraken']:
          for raw_id, info in catalogue.spot_instruments[venue].items():
            if info['base'] == 'bitcoin' and info['quote'] == 'tether':
              print(venue, '->', raw_id)
              break
      resultTemplate: |
        mexc   -> BTCUSDT
        okx    -> BTC-USDT
        kraken -> XBTUSDT

  trades_history:
    group: Your account data
    signature: "trades_history(id, start, end) -> PaginatedResponse[Trade]"
    description: Your fills over a window, paginated — async-iterate the pages or await the whole thing.
    public: false
    # Trade.fee.asset on Hyperliquid (spot and perp both — trades.py handles both mixins)
    # used to be a raw symbol name rather than a numeric token index — same real mismatch
    # as rules.base/.quote, fixed the same way, at the source: trades.py now resolves
    # feeToken through the same Shared.resolve_asset_index() rules.py uses (see that
    # method's comment above). `constants.hyperliquid.fee_asset` below is that resolved
    # index, so it genuinely round-trips through `catalogue.asset_translations`.
    example:
      accountVenues: [mexc]
      constants:
        mexc: {market_id: 'mexc:spot:BTCUSDT', price1: '60123.40', qty1: '0.01', price2: '60050.00', qty2: '-0.02', fee_asset: USDT}
        hyperliquid: {market_id: 'hyperliquid:spot:UBTC/USDC:142', price1: '60095.60', qty1: '0.01', price2: '60040.00', qty2: '-0.02', fee_asset: '0'}
      callTemplate: |
        from tribulnation.sdk import MarketSDK
        from dotenv import load_dotenv

        load_dotenv()

        sdk = MarketSDK.load('sdk.toml')

        trades = []
        async for page in sdk.trades_history('{{ constants[accounts[0]].market_id }}', start, end):
          for trade in page:
            trades.append(trade)
            print(trade.price, trade.qty)
      resultTemplate: |
        {{ constants[accounts[0]].price1 }} {{ constants[accounts[0]].qty1 }}
        {{ constants[accounts[0]].price2 }} {{ constants[accounts[0]].qty2 }}
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for trade in trades:
          if trade.fee:
            print(trade.price, catalogue.asset_translations['{{ accounts[0] }}'][trade.fee.asset])
      resultTemplate: |
        {{ constants[accounts[0]].price1 }} {{ catalogue.asset_translations[accounts[0]][constants[accounts[0]].fee_asset] }}

  trades_stream:
    group: Your account data
    signature: "trades_stream(id, *, queue_size=1000, overflow='fail') -> AsyncContextManager[AsyncIterable[Trade]]"
    description: Your live fills — a bounded queue that fails loudly rather than silently dropping one.
    public: false
    example:
      accountVenues: [mexc]
      constants:
        mexc:
          market_id: 'mexc:spot:BTCUSDT'
          ticks:
            - {price: '60123.40', qty: '0.01'}
            - {price: '60124.00', qty: '-0.02'}
            - {price: '60125.10', qty: '0.05'}
        hyperliquid:
          market_id: 'hyperliquid:spot:UBTC/USDC:142'
          ticks:
            - {price: '60096.80', qty: '0.01'}
            - {price: '60097.40', qty: '-0.02'}
            - {price: '60098.50', qty: '0.05'}
      callTemplate: |
        from tribulnation.sdk import MarketSDK
        from dotenv import load_dotenv

        load_dotenv()

        sdk = MarketSDK.load('sdk.toml')

        async with sdk.trades_stream('{{ constants[accounts[0]].market_id }}') as trades:
          async for trade in trades:
            print(trade.price, trade.qty)
      resultTemplate: |
        {% for t in constants[accounts[0]].ticks %}
        {{ t.price }} {{ t.qty }}

        {% endfor %}
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['mexc', 'okx', 'kraken']:
          for raw_id, info in catalogue.spot_instruments[venue].items():
            if info['base'] == 'bitcoin' and info['quote'] == 'tether':
              print(venue, '->', raw_id)
              break
      resultTemplate: |
        mexc   -> BTCUSDT
        okx    -> BTC-USDT
        kraken -> XBTUSDT


            if info['base'] == 'bitcoin' and info['quote'] == 'tether':
              print(venue, '->', raw_id)
              break
      resultTemplate: |
        mexc   -> BTCUSDT
        okx    -> BTC-USDT
        kraken -> XBTUSDT

  place_order:
    group: Trading
    signature: "place_order(id, order, *, settings={}) -> OrderResponse"
    description: "Submit an order. type is 'MARKET' | 'LIMIT' | 'POST_ONLY' — a venue-agnostic contract."
    public: false
    example:
      accountVenues: [mexc]
      constants:
        mexc: {market_id: 'mexc:spot:BTCUSDT', order_id: '4834937'}
        hyperliquid: {market_id: 'hyperliquid:spot:UBTC/USDC:142', order_id: '184920371'}
      callTemplate: |
        from tribulnation.sdk import MarketSDK
        from dotenv import load_dotenv

        load_dotenv()

        sdk = MarketSDK.load('sdk.toml')

        order = {'type': 'LIMIT', 'qty': 0.01, 'price': 60_000}
        response = await sdk.place_order('{{ constants[accounts[0]].market_id }}', order)
      resultTemplate: |
        OrderResponse(id='{{ constants[accounts[0]].order_id }}', details={...})
    catalogue:
      callTemplate: |
        # pip install tribulnation-catalogue

        from tribulnation.catalogue import Catalogue

        catalogue = Catalogue.load()  # cached locally, no credentials needed
        for venue in ['mexc', 'okx', 'kraken']:
          for raw_id, info in catalogue.spot_instruments[venue].items():
            if info['base'] == 'bitcoin' and info['quote'] == 'tether':
              print(venue, '->', raw_id)
              break
      resultTemplate: |
        mexc   -> BTCUSDT
        okx    -> BTC-USDT
        kraken -> XBTUSDT


    example:
      accountVenues: [mexc]
      constants:
        mexc: {market_id: 'mexc:spot:BTCUSDT', notional: '8120.00'}
        hyperliquid: {market_id: 'hyperliquid:spot:UBTC/USDC:142', notional: '7640.00'}

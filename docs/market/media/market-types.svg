<svg xmlns="http://www.w3.org/2000/svg" width="480" height="424" viewBox="0 0 480 424" role="img" aria-label="Market types: which account reads live where">
<title>Market types: which account reads live where</title>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; }
.title { font-size: 16px; font-weight: 600; }
.small { font-size: 13px; }
.muted { fill: #59636e; }
.bg { fill: #ffffff; stroke: #d0d7de; }
.market { fill: #f6f8fa; stroke: #8c959f; }
.spot { fill: #dafbe1; stroke: #1a7f37; }
.margin { fill: #fbefff; stroke: #8250df; }
.money { fill: #fff8c5; stroke: #9a6700; }
.shared { fill: #fff8c5; stroke: #9a6700; stroke-width: 2.5; }
.warn { fill: #fff1e5; stroke: #bc4c00; stroke-dasharray: 5 4; }
.link { stroke: #59636e; stroke-width: 1.5; fill: none; }
.head { fill: #59636e; }
.rule { stroke: #d0d7de; }
@media (prefers-color-scheme: dark) {
  text { fill: #f0f6fc; }
  .muted { fill: #9198a1; }
  .bg { fill: #0d1117; stroke: #3d444d; }
  .market { fill: #151b23; stroke: #656c76; }
  .spot { fill: #10261a; stroke: #3fb950; }
  .margin { fill: #221a33; stroke: #a371f7; }
  .money, .shared { fill: #2a2312; stroke: #d29922; }
  .warn { fill: #2b1a0f; stroke: #f0883e; }
  .link { stroke: #9198a1; }
  .head { fill: #9198a1; }
  .rule { stroke: #3d444d; }
}
</style>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect x="0.5" y="0.5" width="479" height="423" rx="12" class="bg"/>
<rect x="90" y="16" width="300" height="62" rx="7" class="market"/>
<text x="240" y="42" class="title" text-anchor="middle">Market</text>
<text x="240" y="64" class="muted" text-anchor="middle">books · trades · orders · rules · fees</text>
<polyline points="240,78 240,98" class="link"/>
<polyline points="125,98 355,98" class="link"/>
<polyline points="125,98 125,118" class="link"/>
<polyline points="355,98 355,118" class="link"/>
<rect x="16" y="118" width="218" height="180" rx="7" class="spot"/>
<text x="32" y="144" class="title" text-anchor="start">SpotMarket</text>
<text x="32" y="163" class="small muted" text-anchor="start">kind 'spot' · is_spot(m)</text>
<text x="32" y="194" class="mono" text-anchor="start">balances()</text>
<text x="32" y="216" class="mono" text-anchor="start">collateral_ids()</text>
<text x="32" y="238" class="mono" text-anchor="start">rules() → SpotRules</text>
<text x="32" y="264" class="small muted" text-anchor="start">Balance(total, free) of</text>
<text x="32" y="281" class="small muted" text-anchor="start">the base and quote assets</text>
<rect x="246" y="118" width="218" height="180" rx="7" class="margin"/>
<text x="262" y="144" class="title" text-anchor="start">MarginMarket</text>
<text x="262" y="163" class="small muted" text-anchor="start">is_margin(m)</text>
<text x="262" y="194" class="mono" text-anchor="start">position()</text>
<text x="262" y="216" class="mono" text-anchor="start">collateral()</text>
<text x="262" y="238" class="mono" text-anchor="start">leverage()</text>
<text x="262" y="260" class="mono" text-anchor="start">available_notional()</text>
<text x="262" y="282" class="mono" text-anchor="start">collateral_id()</text>
<polyline points="355,298 355,322" class="link"/>
<rect x="246" y="322" width="218" height="86" rx="7" class="margin"/>
<text x="262" y="348" class="title" text-anchor="start">PerpMarket</text>
<text x="262" y="370" class="mono" text-anchor="start">+ funding · index</text>
<text x="262" y="392" class="small muted" text-anchor="start">kind 'perp' · is_perp(m)</text>
<rect x="16" y="322" width="218" height="86" rx="7" class="warn"/>
<text x="32" y="346" class="mono" text-anchor="start">market.position()?</text>
<text x="32" y="368" class="small" text-anchor="start">Not on Market: narrow with</text>
<text x="32" y="386" class="small" text-anchor="start">is_perp(m), or fetch with</text>
<text x="32" y="402" class="mono small" text-anchor="start">sdk.perp_market(id)</text>
</svg>

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tribulnation-nado"
version = "0.1.0"
description = "Tribulnation SDK implementation for Nado spot and perpetual markets."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "tribulnation-sdk>=4.0.0",
  "typed-nado>=0.1.0",
  "typed-core>=0.14",
]
readme = {file = "README.md", content-type = "text/markdown"}

[project.urls]
Repository = "https://github.com/tribulnation/sdk.git"

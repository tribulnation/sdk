# auth = false means market data works on a credential-free (`public = true`) account;
# auth = true means every call needs a real accounts.Risex() entry.

[support.market]
support = "full"
auth = false
kinds = ["perp"]
note = "USDC-margined perpetuals (`perp`). Market ids are the venue's numeric `market_id` (`'1'` is BTC/USDC on mainnet and testnet); names are not unique, so they are not ids. `markets()` lists the `active` and unlocked markets; `rules().api` also excludes reduce-only ones. RISEx has no API keys: every account read is public, so an `address` alone serves them; a registered `signer_key` also places and cancels orders and opens the fills stream, and either key logs in for `fees` (the account's tier rates, a negative maker rate a rebate). `rules().fees` is `None` (the schedule is served to logged-in accounts only). `depth` is the aggregated REST book, at most 250 levels a side, unstamped; `depth_stream` maintains the book from the venue's snapshot and per-block level updates, each market on its own connection. Tickers carry only the last price and 24h quote volume: the venue publishes no best bid/ask in its market data, nor a base volume. Candles serve `1m` to `1d`, chunked under the venue's 86,400-interval range cap, and are the venue's as sent: some have an `open` or `close` outside `[low, high]` (hourly BTC, 2026-11-10..17: 8 of 168 on mainnet, 60 of 144 on testnet), and in each the `open` is the previous candle's `close`; an accepted venue limitation the adapter does not repair (ADR 0061). Orders are signed EIP-712 permits sent in integer ticks and steps, so off-grid prices and sizes raise `ValueError` before signing; placements and cancels are mined before the venue replies. `LIMIT` rests until cancelled, `POST_ONLY` adds `post_only`, and `MARKET` is an IOC limit at `price` (the venue's own market order is not bounded by its price: on testnet one priced under the bid filled above it); `filled_qty` is reported for `MARKET` only. `client_order_id` is a decimal integer. A refused placement raises `OrderRejected` (a crossing post-only reverts with `PostOnlyOrderMatched()`, a size below the minimum with `BelowMinOrderSize`, a price too far from the mark with `OrderPriceOutsideMatchBand`), and cancelling an order no longer resting `OrderNotFound`. `replace_order` is cancel then place (no venue modify); `cancel_open_orders` is the venue's one-transaction cancel-all of the market. Order ids are the venue's composite ids (`0x` and 48 hex digits). Collateral is the account's one cross bucket, `<account>:perp` for every market; accounts holding an isolated position raise NotImplementedError from it. `leverage` is the market's setting, the market maximum where never set. `set_leverage` signs an `update_leverage` permit with the signer key, mined before the venue replies, and leaves the margin mode alone; it takes whole multiples up to the market's `max_leverage` (and never above 255, the permit's `uint8`), refusing a larger value with `ValueError` before signing. Funding settles hourly; `next_funding` and `perp_stats` funding are the venue's estimate from its `expected_funding_rate` stream, positive when longs pay, and `funding_payments` are received-positive (the venue's `funding_payment` negated), unsettled accruals included. Trading is verified on testnet only (mainnet is invite-only)."
# Credential modes (ADR 0042). Public (`public = true`, no address): market data only. An
# address alone serves every account read below (RISEx's reads are public). A key adds
# the JWT read `fees`; the signer key adds orders, cancels and `trades_stream`.

[support.report]
support = "partial"
auth = true
methods = ["snapshot"]
note = "Snapshots of one account (an address suffices), labelled by its address: the settled USDC balance, without unrealized PnL, and open positions by `market_id` at their average entry price. An open position's opening fees and accrued funding reach the balance only when the position changes. Isolated positions raise NotImplementedError. History is not supported."

[ids]
asset = "symbol"
market = "The venue's numeric `market_id` as a decimal string (`'1'` is BTC/USDC on mainnet and testnet). Names are not unique (mainnet lists two `DOGE/USDC`), so they are metadata only."
note = "The one asset id is `USDC`, the collateral, fee and funding asset."

# Release qualification of account reads (ADR 0042); not shown in the support matrix.
[qualification.market]
min_mode = "address"
address_methods = [
  "open_orders", "query_order", "trades_history", "funding_payments", "position",
  "perp_position", "collateral", "perp_collateral", "leverage", "available_notional",
  "collateral_id",
]

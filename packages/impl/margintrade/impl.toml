# auth = false means this surface has a real credential-free DEFAULT_ACCOUNTS entry —
# auth = true means every call always needs a real accounts.MarginTrade() entry.

[support.market]
support = "partial"
auth = false
methods = [
  "candles",
  "depth",
  "depth_stream",
  "rules",
  "perp_stats",
  "query_order",
  "open_orders",
  "trades_history",
  "position",
  "collateral",
  "available_notional",
  "index",
  "next_funding",
  "funding_payments",
  "perp_position",
  "perp_collateral",
  "leverage",
]
note = "Perpetuals only (`perp`); the PRL/USDC spot pair is not mapped. Market ids are the venue's coin names (`BTC`, `NVDA`, `PRL`); every market settles in USDC. Account reads are public by address: no key is needed. `rules` derives the price step as `10 ** -(6 - szDecimals)` (prices are also limited to 5 significant figures), the oracle band as `1 / (2 * maxLeverage)` capped at 20%, and fees from the market's own `takerFee`/`makerFee` (no tiers exist). `trades_history` reads the newest 10,000 fills since `start` and raises `ApiError` when older fills in range were cut off; the venue's `endTime` is not reliable for archived fills. `query_order` uses `orderStatus`, which the venue does not scope to the account. `next_funding` is the current hourly rate, settled at the top of the next hour. Not supported: `tickers` (the venue's contexts report no last trade or best bid/ask), `fees` (no account-level schedule), `trades_stream` (unverified channel), `funding_rates` (the venue's `fundingHistory` is empty), and trading (`place_order`/`cancel_*`), which is not attempted: no account trades on the venue and no signed order has been verified."

[support.report]
support = "none"
auth = true
note = "Not implemented yet. Snapshots map onto `clearinghouseState` and `spotClearinghouseState`; history would need the fills limit above resolved."

[support.earn]
support = "none"
auth = true
note = "Margin Trade offers no earn products."

[ids]
asset = "symbol"
market = "The venue's coin name (`'BTC'`, `'NVDA'`, `'PRL'`), as `info.meta` lists it."
note = "The token symbol (`'USDC'`, `'PRL'`), as `info.spot_meta` names it."

# Release qualification of account reads (ADR 0042); not shown in the support matrix.
[qualification.market]
min_mode = "address"
address_methods = [
  "open_orders", "query_order", "trades_history", "funding_payments", "position",
  "perp_position", "collateral", "perp_collateral", "leverage", "available_notional",
]

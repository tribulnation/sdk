# auth = false means market data works on a credential-free (`public = true`) account;
# auth = true means every call needs a real accounts.Grvt() entry.

[support.market]
support = "full"
auth = false
kinds = ["spot", "perp"]
note = "USDT-margined perpetuals (`perp`) and spot (`spot`). Public data needs no credentials; every account read needs an API key (a read-only one suffices), and placing orders also the key's `private_key`. `rules().fees` is GRVT's published tier-1 schedule (read 2026-10-22); `fees` reads the account's tier. Tickers and `perp_stats` send one `ticker` request per market, concurrently. Order ids are client order ids (generated in `[2^63, 2^64)`). `MARKET` is the venue's immediate-or-cancel market order and does not send `price`; `LIMIT` and `POST_ONLY` are good-till-time, expiring 29 days after signing (GRVT caps a signature at 30 days). Refusals of order validation (`2064` off-tick price, `2065` size off the step, `2066` below the minimum notional, margin) raise `OrderRejected`; refusals after acceptance show as a `REJECTED` order state. Funding settles every 4 or 8 hours (the instrument's interval); rates are converted from percentage points, and rows the venue recorded every minute before mid-October 2025 (`funding_interval_hours` 0) are not settlements and are dropped. Funding payments are received-positive. `perp_collateral` is the trading sub-account's cross bucket (equity `total_cross_equity`, the cross margins, and free collateral `margin_balance` less the initial margin, which equals the venue's `max_addable_amount`), or, for a market holding an isolated position, that position's own bucket (`isolated_balance` plus unrealized PnL, `isolated_im`, `isolated_mm`; free is the excess over `isolated_im`, matching `max_removable_amount`, verified only with a negative unrealized PnL, so it may overstate what can be removed while in profit); a market without a position reads cross. `available_notional` is free cross collateral times `leverage`, the account's initial leverage on the market, in either margin type (isolated margin is taken from the cross pool), without GRVT's position-size cap or risk brackets. Margin types and leverage are not set through the SDK. Spot (`spot`) is GRVT's `SPOT_SWAP` instruments (`GRVT_USDT_SpotSwap`): ordinary order books, traded with the perpetuals' order, cancellation, fill and book paths scoped to the `SPOT_SWAP` kind, and settled in the trading sub-account's spot wallet; collateral IDs are `<account>:spot:<asset>`. `balances` reads that wallet (`spot_account_summary`): total is `balance`, free is `available_to_transfer`, which excludes open-order holds (testnet, 2026-10-28: a resting buy held its quote cost, a resting sell its base quantity). Spot `rules()` have `fee_asset` None (base on a buy, quote on a sell) and no `fees` (GRVT publishes no standard spot schedule); `fees` reads the tier's spot rates. Spot orders are verified on testnet only (2026-10-28): `POST_ONLY` buys and sells rest, the three cancellation methods release their holds, `MARKET` buys and sells fill, and fees are charged in the delivered asset (GRVT on a buy, USDT on a sell). A filled `MARKET` order's `query_order` price is `0`, the venue's order having no limit price. A fill reaches the fills stream at once, but trade history a few seconds later."
# Credential modes. Public (`public = true`, no API key): market data only. An API key
# alone (a read-only key suffices) serves every account read below: a read-only token in
# ADR 0042's terms. Its EIP-712 signer key (`private_key`) adds placing orders.

[support.report]
support = "partial"
auth = true
methods = ["snapshot"]
note = "Snapshots, with an API key (a read-only one suffices): the funding account's wallet as `funding`, and every trading sub-account the key can read as `<sub_account_id>:futures` (cash balances, isolated positions' balances included, without unrealized PnL, and positions by instrument name) and `<sub_account_id>:spot`. Vault investments, borrowed balances and vault sub-accounts raise NotImplementedError. History is not supported."

[ids]
asset = "symbol"
market = "The instrument name (`BTC_USDT_Perp`, `GRVT_USDT_SpotSwap`), the same on mainnet and testnet."
note = "Asset ids are the venue's currency codes (`USDT`, `USDC`)."

# Release qualification of account reads (ADR 0042); not shown in the support matrix.
[qualification.market]
min_mode = "token"
token_methods = [
  "fees", "open_orders", "query_order", "trades_history", "funding_payments",
  "position", "perp_position", "collateral", "perp_collateral", "leverage",
  "available_notional", "collateral_id", "balances", "collateral_ids",
]

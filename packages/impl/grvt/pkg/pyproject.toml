[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tribulnation-grvt"
version = "0.2.0"
description = "Tribulnation SDK implementation for GRVT perpetual markets."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "tribulnation-sdk>=3.0.0",
  "typed-grvt>=0.2.0",
  "typed-core>=0.13",
]
readme = {file = "README.md", content-type = "text/markdown"}

[project.urls]
Repository = "https://github.com/tribulnation/sdk.git"

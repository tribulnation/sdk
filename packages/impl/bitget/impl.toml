# auth = false means this surface has a real credential-free DEFAULT_ACCOUNTS entry —
# auth = true means every call always needs a real accounts.Bitget() entry.

[support.market]
support = "partial"
auth = false
methods = [
  "depth", "depth_stream", "tickers", "rules", "candles", "perp_stats", "query_order", "open_orders",
  "trades_history", "trades_stream", "position", "collateral", "available_notional",
  "index", "next_funding", "funding_rates", "perp_position", "perp_collateral",
]
note = "Read-only: `place_order`/`cancel_*` raise `NotImplementedError` (not a venue we trade on). `funding_payments` is unsupported on either account mode, since Bitget publishes no closed set of futures ledger types to filter a settlement on. On a Classic account `perp_collateral` and the exchange-level spot `collateral` are unsupported too (the futures wallet reports no margin requirement, the spot wallet no pool). `candles` serves every contract interval on both exchanges, oldest first; perp pages 198 candles back to the contract's listing, spot pages 1000 but only reaches the venue's recent horizon (about two months of hourly candles), since the spot history endpoint has no paged walk in the typed client yet."
# MarketSDK.DEFAULT_ACCOUNTS includes 'bitget' (Bitget(public=True)) — public market data
# (markets, depth, depth_stream, tickers, rules, perp_stats, index, next_funding,
# funding_rates) comes from the venue's public endpoints and is the same whatever the
# account's mode. Account-scoped reads dispatch on the mode (Classic vs UTA), detected
# on first use. `perp` lists the USDT-margined perpetuals only (the product line can also
# carry delivery contracts, which pay no funding). `query_order` is the base scan of
# `open_orders`: the order-info endpoints exist but were never exercised against an order.

[support.earn]
support = "full"
auth = true

[support.wallet]
support = "full"
auth = true

[support.report]
support = "none"
auth = true
note = "`tribulnation.bitget.reporting.Reporting` implements snapshots and history, but against classic-account endpoints the unified trading account (UTA) doesn't support, so it isn't wired into `ReportSDK`. Import it directly if you're on a classic account."
# Flip to `full` once it's reimplemented against UTA and wired into the router.

[ids]
asset = "symbol"
note = "The venue's coin name (`BTC`, `USDT`); market ids are concatenated pair symbols (`BTCUSDT`)."

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tribulnation-bit2me"
version = "0.4.0"
authors = [
  {name="Marcel Claramunt", email="marcel@tribulnation.com"}
]
description = "Tribulnation SDK implementation for Bit2Me."
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "tribulnation-sdk>=1.8.0", "typed-bit2me>=0.4.0"
]
requires-python = ">=3.10"
readme = {file="README.md", content-type="text/markdown"}

[project.urls]
Repository = "https://github.com/tribulnation/sdk.git"

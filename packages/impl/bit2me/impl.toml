# auth = false means this surface has a real credential-free DEFAULT_ACCOUNTS entry —
# auth = true means every call always needs a real accounts.Bit2Me() entry.

[support.earn]
support = "full"
auth = false
# EarnSDK.DEFAULT_ACCOUNTS includes 'bit2me' (Bit2Me(public=True)), and it is genuinely
# free: both endpoints `instruments()` reads (`v2/earn/assets`, `v2/earn/apy`) are public.
# Every instrument comes out tagged `flexible` — B2M's 3/6/12-month locks are the only
# ones the venue offers and `apy()` quotes no per-lock rate, so a `fixed` instrument's APR
# isn't derivable. That's the venue's data shape, not a gap in the mapping.

[support.report]
support = "full"
auth = true
note = "`history()` covers spot trades, on-chain deposits/withdrawals and Earn rewards. Internal transfers between the spot/earn/pocket compartments, fiat funding, loans and Social Pay are separate ledgers and aren't mapped."
# ReportSDK never has a DEFAULT_ACCOUNTS entry for any venue.

[support.wallet]
support = "full"
auth = true
note = "Deposit and withdrawal methods come from the per-asset chain list (`v1/wallet/currency/{symbol}/network`). Withdrawal fees are quoted live through the proforma endpoint, only for the networks a destination address is configured for (`quote_addresses`), because that is the only place Bit2Me publishes one."
# The asset catalogue (`v2/currency/assets`) shows one display network per asset and was
# the old blocker; the per-asset network endpoint answers with the true chain list (ETH on
# 7 networks, USDT on 10) whose `id` is the slug the withdrawal proforma expects.

[support.market]
support = "full"
auth = false
note = "Spot only. `rules().maker_fee`/`taker_fee` are always `0` because no Bit2Me endpoint publishes a fee rate ahead of a fill, and `tickers()` carries no `bid_qty`/`ask_qty` because `v2/trading/tickers` quotes prices only."
# MarketSDK.DEFAULT_ACCOUNTS includes 'bit2me' (Bit2Me(public=True)): markets, depth,
# tickers and rules are public; account-scoped methods still need real credentials.

[ids]
asset = "symbol"
note = "The venue's ticker symbol (`BTC`, `EUR`); market ids are `<base>/<quote>` (`BTC/EUR`)."

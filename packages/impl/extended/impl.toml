# auth = false means market data works on a credential-free (`public = true`) account;
# auth = true means every call needs a real accounts.Extended() entry.

[support.market]
support = "partial"
auth = false
methods = [
  "depth", "depth_stream", "tickers", "rules", "fees", "candles",
  "query_order", "open_orders", "trades_history", "trades_stream",
  "position", "collateral", "available_notional",
  "place_order", "place_orders", "cancel_order", "cancel_orders", "cancel_open_orders",
  "index", "next_funding", "perp_stats", "funding_rates", "perp_position",
  "leverage", "perp_collateral",
]
note = "USD-collateral perpetuals (`perp`); market ids are the venue's market names (`BTC-USD`), and `markets()` lists the `ACTIVE`, `REDUCE_ONLY` and `PRELISTED` ones (`rules().api` is `ACTIVE`). An account is one sub-account: its API key reads it and cancels its orders, and its Stark private key and vault also place orders. `depth` is the whole aggregated REST book, with no timestamp; on RFQ markets (`isRfq`, most of them) the REST book is only indicative, so `depth` takes the first snapshot of the `orderbooks/rfq` quotes stream and `depth_stream` maintains the quotes. An inactive market has no book (`MissingData`). Tickers carry no best-level sizes, and a `0` price is `None`; on RFQ markets their bid and ask are the indicative book's, not the quotes `depth` returns (ADR 0048, a recorded consistency limitation). `rules().fees` is `None` (no standard schedule is published); `fees` is the sub-account's maker and taker rate per market, and RFQ orders always pay the taker rate. Candles are trade candles, no quote volume. `place_order` sends RFQ markets' orders through the RFQ endpoint (which refuses `POST_ONLY`); `LIMIT` and `POST_ONLY` rest good-till-time until the network's longest expiry (90 days on mainnet, 28 on testnet, less a minute), `MARKET` is the venue's IOC market order bounded by `price`, self-trade protection is `ACCOUNT`, and off-grid prices or sizes raise before signing. `client_order_id` is the order's `externalId` (`random_client_order_id()` gives 32 hex digits). Acceptance is asynchronous: `filled_qty` is `None`, a later engine rejection shows as `REJECTED` in `query_order`, and only a coded refusal (other than `1134` DuplicateOrder and `1006` UnhandledError) raises `OrderRejected`. Order ids are Extended's numeric order ids. `open_orders` lists the market's open `LIMIT` orders, and `cancel_open_orders` cancels exactly those in one mass cancel: conditional, TP/SL and TWAP orders are neither listed nor cancelled. Trade history reads the 10,000 most recent fills; exchange-wide history leaves out spot fills and includes delisted perpetuals. Collateral is the sub-account's one cross bucket; maintenance margin is `marginRatio x equity`. `available_notional` is free collateral times the account's leverage, without the margin schedule's position-value cap. Funding is hourly; `funding_payments` raises NotImplementedError until the sign of `fundingFee` is observed on a payment. The testnet stream host refuses every stream connection (`503`), so streams are verified on mainnet only."

[support.report]
support = "full"
auth = true
note = "One account is one sub-account: snapshots and history read the sub-account its API key belongs to (a read-only key is enough), labelled by its `accountId`; another sub-account of the wallet needs its own key. Snapshots: every spot balance, the `USD` collateral as the wallet balance without unrealized PnL, and open perpetual positions by market. History: completed transfers between sub-accounts as `InternalTransfer`s between sub-account ids, the Hyperliquid precedent (with a `FeeLeg` when charged), completed deposits, withdrawals that are not rejected, testnet faucet claims as `Bonus`, fills (the 10,000 most recent; `FutureTrade`, or `SpotTrade` on spot markets) and closed positions as `FuturePositionSummary` with realized PnL, fees and funding. History raises NotImplementedError when the window holds a funding payment or a borrow-interest payment, whose signs are not yet observed, or a fill with a builder fee."

[support.wallet]
support = "none"
auth = true
note = "Not implemented: the Extended integration covers Market and Report only."

[support.earn]
support = "none"
auth = true
note = "Not implemented: the Extended integration covers Market and Report only; the public vault's shares (`XVS`) appear as a spot balance in Report snapshots."

[ids]
asset = "symbol"
market = "The venue's market names (`BTC-USD`, `ETH-USD`), identical on mainnet and testnet."
note = "Asset IDs are the venue's asset names: `USD` (the collateral, fee and funding asset), spot assets such as `BTCSPOT`, and the vault share `XVS`."

# Release qualification of account reads (ADR 0042); not shown in the support matrix.
# Every account read needs the sub-account's API key: there is no address or token mode.
[qualification.market]
min_mode = "private"

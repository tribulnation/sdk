[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tribulnation-extended"
version = "0.1.1"
description = "Tribulnation SDK implementation for Extended perpetuals."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
readme = {file = "README.md", content-type = "text/markdown"}
dependencies = ["tribulnation-sdk>=2.21.0", "typed-extended>=0.2.0"]

[project.urls]
Repository = "https://github.com/tribulnation/sdk.git"

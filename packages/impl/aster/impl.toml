[support.market]
support = "partial"
auth = false
methods = [
  "depth", "depth_stream", "tickers", "rules", "fees", "candles",
  "query_order", "open_orders", "trades_history", "trades_stream",
  "position", "collateral",
  "place_order", "place_orders", "cancel_order", "cancel_orders", "cancel_open_orders",
  "index", "next_funding", "funding_rates", "perp_stats", "perp_position",
  "perp_collateral", "funding_payments", "leverage", "available_notional",
]
note = "Spot and linear perpetuals. Public reads need no credentials; `fees` and every account and trading method need `user` and `signer`. Aster publishes no fee schedule, so `rules().fees` is None. Public reads, perpetual funding payments and the account reads (fees, spot balances, spot and perpetual trade history, perpetual position, collateral, leverage and available_notional) are verified on mainnet; order placement and cancellation only on testnet. MARKET ignores the SDK price; LIMIT uses GTC and POST_ONLY uses GTX. Depth streams carry up to 20 levels. Rules name no fee asset (`fee_asset = None`): a spot fill pays in the asset it delivers (base on buys, quote on sells), and a perpetual fill pays ASTER when the account's futures `feeBurn` setting is on and the wallet holds ASTER, else the margin asset; `Trade.fee.asset` reports each fill's asset. Spot position is the base balance and collateral the quote balance, free plus locked; spot balances and trade history are mainnet-only, as testnet omits them. Trade history reads inclusive bounds in native seven-day windows up to the current time, for one pair or all spot pairs; exchange-wide perpetual history is unsupported. Perpetuals support one-way positions only (hedge mode raises). perp_collateral reads the join-margin account: the cross bucket is the account totals less isolated positions, with leverage as cross notional over equity; an isolated market reports its own position margin. Perpetual `leverage` is the symbol's configured initial leverage from `positionRisk`; `available_notional` is the cross `availableBalance` times it, capped by the leverage bracket's remaining notional and the symbol's remaining open-interest allowance. perp_stats reads open interest only for at most five explicitly named contracts. Order settings are not supported."

[support.report]
support = "partial"
auth = true
methods = ["snapshot"]
note = "Mainnet snapshots, signed by the trading agent: a `perp` subaccount with the futures wallet balances (without unrealized PnL) and open positions by symbol, a `spot` subaccount with free plus locked balances, and a `staking` subaccount with ASTER staked on Aster Chain (active, pending and unstaking) plus unclaimed rewards. Testnet snapshots raise NotImplementedError: its spot account information omits funded balances. Cash-ledger history exists in the package (tribulnation.aster.Report) but is verified on testnet only."

[support.wallet]
support = "none"
auth = true
note = "typed-aster lacks the deposit and withdrawal asset catalogues."

[support.earn]
support = "none"
auth = true
note = "No native Earn instrument catalogue."

[ids]
asset = "symbol"
market = "Native concatenated symbols such as BTCUSDT, under the spot and perp exchange IDs."
note = "Asset IDs remain native (USDT, ASTER)."

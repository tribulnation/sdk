[support.market]
support = "partial"
auth = false
methods = [
  "depth", "depth_stream", "tickers", "rules", "fees", "candles",
  "query_order", "open_orders", "trades_history", "trades_stream",
  "position", "collateral",
  "place_order", "place_orders", "cancel_order", "cancel_orders", "cancel_open_orders",
  "index", "next_funding", "funding_rates", "perp_stats", "perp_position",
  "funding_payments",
]
note = "Spot and linear perpetuals. Public reads and perpetual funding payments are verified on mainnet; other account and trading methods only on testnet. MARKET ignores the SDK price; LIMIT uses GTC and POST_ONLY uses GTX. Depth streams carry up to 20 levels. Position and collateral cover one-way, cross-margin perpetuals only. perp_stats reports no open interest. Perpetual trades_history reads inclusive bounds in native seven-day windows up to the current time. Funding payments use native income history, with positive amounts paid, for one market or all perpetuals. Unsupported: spot balances, spot trade history, available_notional and perp_collateral."

[support.report]
support = "partial"
auth = true
methods = ["snapshot"]
note = "Mainnet snapshots, signed by the trading agent: a `perp` subaccount with the futures wallet balances (without unrealized PnL) and open positions by symbol, a `spot` subaccount with free plus locked balances, and a `staking` subaccount with ASTER staked on Aster Chain (active, pending and unstaking) plus unclaimed rewards. Testnet snapshots raise NotImplementedError: its spot account information omits funded balances. Cash-ledger history exists in the package (tribulnation.aster.Report) but is verified on testnet only."

[support.wallet]
support = "none"
auth = true
note = "typed-aster lacks the deposit and withdrawal asset catalogues."

[support.earn]
support = "none"
auth = true
note = "No native Earn instrument catalogue."

[ids]
asset = "symbol"
market = "Native concatenated symbols such as BTCUSDT, under the spot and perp exchange IDs."
note = "Asset IDs remain native (USDT, ASTER)."

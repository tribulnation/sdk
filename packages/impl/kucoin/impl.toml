[support.report]
support = "partial"
auth = true
methods = ["history", "snapshot"]
note = "Classic spot-side only. History includes automatically discovered spot fills and successful external/internal deposits/withdrawals. Defaults: seven days for spot fills, 30 days for capital history. Snapshots include main/trade balances and paginated Earn holdings. No futures endpoints or permissions are required; futures and legacy margin/isolated compartments are excluded, not reported as zero. Supported-source errors propagate. Retention, delisted markets and unsupported Earn/internal ledgers leave gaps for file ingestion; other user subaccounts are not included."

[support.wallet]
support = "full"
auth = true
note = "Both methods use public currency metadata and support public=True. Enabled chains only; withdrawal fees are published per-chain minimums, not a transaction quote. No credential-free default account is installed."

[support.earn]
support = "partial"
auth = true
methods = ["instruments"]
note = "Savings, promotions, staking, KCS staking and ETH staking. Structured dual investment is excluded because conditional principal conversion cannot be represented by the plain APR contract."

[support.market]
support = "partial"
auth = false
kinds = ["spot", "perp"]
methods = [
  "depth", "depth_stream", "rules", "tickers", "candles", "index", "next_funding", "perp_stats", "funding_rates",
  "fees", "query_order", "open_orders", "trades_history", "trades_stream",
  "balances", "collateral_ids", "collateral", "collateral_id", "position", "perp_position", "perp_collateral",
  "available_notional", "leverage", "set_leverage", "funding_payments",
  "place_order", "place_orders", "cancel_order", "cancel_orders", "replace_order", "replace_orders", "cancel_open_orders",
]
note = "Classic spot (HF orders, the `trade` account) and USDT/USDC-settled linear perpetuals; exchange IDs `spot` and `perp`. Inverse and dated contracts are excluded. Public data needs no credentials (`accounts.Kucoin(public=True)`); account and trading methods need an API key, secret and passphrase (`KUCOIN_API_KEY`/`KUCOIN_API_SECRET`/`KUCOIN_API_PASSPHRASE`), a sub-account's own key trading that sub-account. Futures quantities are converted between contracts and base units by the contract multiplier; an order that is not a whole number of contracts, off the tick or step grid, below the minimum size or notional, or above the maximum raises ValueError before anything is sent. LIMIT is GTC, POST_ONLY sets `postOnly`, MARKET is an IOC limit at the SDK price (price protection kept). Spot orders are placed synchronously: a crossing post-only or unmatched IOC raises OrderRejected and `filled_qty` is the dealt size; futures orders are acknowledged before matching, so a MARKET is read back once (done with nothing filled raises OrderRejected) and a futures POST_ONLY that would cross is cancelled by the venue after the acknowledgement, not refused. `client_order_id` is sent as `clientOid` (a random 32-hex one when omitted) and reported on stream fills. `replace_order` cancels then places (no native amend is used). Perpetuals are one-way, cross margin: orders send `marginMode=CROSS` and the symbol's cross leverage; `leverage`/`set_leverage` read and change that setting (whole multiples). `perp_collateral` is the cross pool of the contract's settlement currency (overview equity and available balance, position plus order margin, summed position maintenance margin) or an isolated position's own margin; `collateral_id` is `<account>:perp` for USDT-settled contracts (USDC-settled raise NotImplementedError). `fees` are the account's actual rates (VIP and market-maker program; maker rebates are negative) plus any reported tax rate. `trades_stream` reads the private order channels (fills carry order and client IDs and the liquidity role, no fee); a dropped connection fails the stream with NetworkError and re-subscribing reconnects with a fresh bullet token. `trades_history` walks seven-day windows (spot HF fills; futures trades, liquidations and ADL); `funding_payments` one-day windows. RateLimited carries KuCoin's quota reset (`tribulnation.kucoin.retry_after`). Account reads and the private order channels were checked live on a mainnet account on 2026-11-27; order placement, cancels and fills are unit-tested against fake responses only and not yet verified live."

[ids]
asset = "symbol"
market = "Native spot symbols such as BTC-USDT under exchange spot; linear perpetual symbols such as XBTUSDTM under exchange perp."
note = "Native currency ids and chainId network ids. Snapshot compartments are Classic main/trade and Earn."

# Release qualification of account reads (ADR 0042); not shown in the support matrix.
[qualification.market]
min_mode = "private"


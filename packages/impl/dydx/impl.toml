# auth = false means this surface has a real credential-free DEFAULT_ACCOUNTS entry —
# auth = true means every call always needs a real accounts.Dydx() entry.

[support.market]
support = "full"
auth = false
note = "`candles` serves every contract interval in the indexer's native newest-first pages, filtered to the required `[start, end)` range. Public rules include active market fee holidays; personal fees also include referral tier overrides and staking discounts, with protocol PPM rounding. Fee holiday reads use Typed's generated public gRPC method until a convenience wrapper is available. Exchange-wide trades and funding history enumerate all subaccounts of the configured address and use native all-market indexer pages, including historical market tickers. Selected-market history likewise includes all address subaccounts. Funding payments preserve native received-positive amounts for both market and exchange history; negative amounts are paid."
# MarketSDK.DEFAULT_ACCOUNTS includes 'dydx' (Dydx(public=True)) — but that only covers
# purely public market-data methods; account-scoped/trading methods still need real
# credentials regardless (see docs/contract/market.yml's per-method `public: false`).

[support.report]
support = "full"
auth = true
# ReportSDK never has a DEFAULT_ACCOUNTS entry for any venue.

[ids]
asset = "symbol"
note = "The venue's token denom symbol (`USDC`); market ids are `<base>-<quote>` tickers (`BTC-USD`)."

# Release qualification of account reads (ADR 0042); not shown in the support matrix.
[qualification.market]
min_mode = "address"
address_methods = [
  "fees", "open_orders", "query_order", "trades_history", "funding_payments", "position",
  "perp_position", "collateral", "perp_collateral", "leverage", "available_notional",
]

# auth = false means this surface has a real credential-free DEFAULT_ACCOUNTS entry —
# auth = true means every call always needs a real accounts.Dydx() entry.

[support.market]
support = "partial"
auth = false
kinds = ["perp"]
methods = [
  "depth",
  "depth_stream",
  "rules",
  "fees",
  "candles",
  "tickers",
  "perp_stats",
  "query_order",
  "open_orders",
  "trades_history",
  "trades_stream",
  "position",
  "collateral",
  "available_notional",
  "collateral_id",
  "place_order",
  "place_orders",
  "cancel_order",
  "cancel_orders",
  "replace_order",
  "replace_orders",
  "cancel_open_orders",
  "index",
  "next_funding",
  "funding_rates",
  "funding_payments",
  "perp_position",
  "perp_collateral",
  "leverage",
  "remaining_position_limit",
]
note = "`candles` serves every contract interval in the indexer's native newest-first pages, filtered to the required `[start, end)` range. Public rules include active market fee holidays; personal fees also include referral tier overrides and staking discounts, with protocol PPM rounding. Fee holiday reads use Typed's generated public gRPC method until a convenience wrapper is available. Exchange-wide trades and funding history enumerate all subaccounts of the configured address and use native all-market indexer pages, including historical market tickers. Selected-market history likewise includes all address subaccounts. Funding payments preserve native received-positive amounts for both market and exchange history; negative amounts are paid. `set_leverage` is not implemented: dYdX sets leverage per subaccount and market with a signed `MsgUpdateLeverage` transaction, which the typed client does not wrap yet."
# MarketSDK.DEFAULT_ACCOUNTS includes 'dydx' (Dydx(public=True)) — but that only covers
# purely public market-data methods; account-scoped/trading methods still need real
# credentials regardless (see docs/contract/market.yml's per-method `public: false`).

[support.report]
support = "full"
auth = true
# ReportSDK never has a DEFAULT_ACCOUNTS entry for any venue.

[ids]
asset = "symbol"
note = "The venue's token denom symbol (`USDC`); market ids are `<base>-<quote>` tickers (`BTC-USD`)."

# Release qualification of account reads (ADR 0042); not shown in the support matrix.
[qualification.market]
min_mode = "address"
address_methods = [
  "fees", "open_orders", "query_order", "trades_history", "funding_payments", "position",
  "perp_position", "collateral", "perp_collateral", "leverage", "available_notional", "remaining_position_limit",
  "collateral_id",
]

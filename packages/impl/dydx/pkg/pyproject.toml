[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tribulnation-dydx"
version = "0.6.0"
authors = [
  {name="Marcel Claramunt", email="marcel@tribulnation.com"}
]
description = "Tribulnation SDK implementation for dYdX."
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "tribulnation-sdk>=1.7.0", "typed-dydx>=2.0.5,<3", "google-cloud-bigquery~=3.41.0", "asyncer",
  "sqlalchemy>=2.0", "sqltypes"
]
requires-python = ">=3.10"
readme = {file="README.md", content-type="text/markdown"}

[project.urls]
Repository = "https://github.com/tribulnation/sdk.git"

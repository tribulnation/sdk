# auth = false means this surface has a real credential-free DEFAULT_ACCOUNTS entry (see
# tribulnation.sdk.impl.<surface>.DEFAULT_ACCOUNTS) — auth = true means every call always
# needs a real accounts.Binance() entry, no free default exists.

[support.earn]
support = "full"
auth = true
note = "Merges Simple Earn (flexible and locked), Soft Staking, On-chain Yields, BFUSD and RWUSD. ETH/SOL staking is left out because Binance publishes no rate for it, and Dual Investment because a position settles in either the invested or the exercised asset, so its yield asset isn't knowable up front."

[support.wallet]
support = "full"
auth = true

[support.market]
support = "partial"
auth = false
methods = [
  "depth",
  "depth_stream",
  "tickers",
  "perp_stats",
  "rules",
  "fees",
  "query_order",
  "open_orders",
  "trades_history",
  "trades_stream",
  "position",
  "collateral",
  "available_notional",
  "index",
  "next_funding",
  "funding_rates",
  "candles",
]
note = "Read-only: order placement and cancellation are not implemented. USD-M serves public rules, depth, streams, tickers, perp_stats, index, next_funding, funding_rates and candles. Bulk snapshots cover active perpetuals only, not dated futures. perp_stats combines bulk pricing/funding with one public open-interest read per market (at most five concurrent); component observations are not atomic. Personal fees combine spot standard/tax/special and buy/sell components; USD-M fees require account permission and use symmetric ordinary-order commissions. Optional BNB payment discounts and RPI orders are excluded. Public standard fees cover only USDT crypto perpetuals; spot, USDC and TradFi schedules remain unknown. Other private futures methods remain unsupported and Report remains spot-side only. Candles serve spot and USD-M, every contract interval, 1000 per page with [start, end) filtering."
# MarketSDK.DEFAULT_ACCOUNTS includes 'binance' (Binance(public=True)) — but that only
# covers purely public market-data methods; account-scoped methods still need real
# credentials regardless (see docs/contract/market.yml's per-method `public: false`).

[support.report]
support = "partial"
auth = true
methods = ["snapshot", "history"]
note = "Spot-side only: snapshots include Spot, Funding and Simple Earn balances; history includes spot fills, deposits/withdrawals and Spot/Funding transfers. No futures endpoints are called and no empty futures compartment is emitted. Supported-source errors propagate. History end defaults to now; omitted start uses 90 days for capital, six calendar months for transfers and retained ID history for automatically discovered spot symbols. API history is best-effort; retention, delisted symbols and endpoint caps leave gaps for file ingestion. Futures, margin, Options, Portfolio Margin, Earn events and Convert/Pay/Fiat history are excluded."
# ReportSDK never has a DEFAULT_ACCOUNTS entry for any venue.
# No caller-supplied traded-symbol configuration is required.

[ids]
asset = "symbol"
note = "The venue's ticker symbol for spot, futures and earn alike (`BTC`, `USDT`); market ids are the venue's concatenated pair symbols (`BTCUSDT`)."

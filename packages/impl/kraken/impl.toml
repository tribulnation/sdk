# auth = false means this surface has a real credential-free DEFAULT_ACCOUNTS entry —
# auth = true means every call always needs a real accounts.Kraken() entry.

[support.earn]
support = "full"
auth = true
note = "`instruments()` reads `Earn/Strategies`, which needs an API key. `apr` is the midpoint of Kraken's `low`/`high` estimate, so a range collapses to one number; `min_qty` is never set because Kraken's `user_min_allocation` is in USD, not the asset; `max_qty` is the native-asset `user_cap`. Account-wide Kraken Rewards (`lock_type = flex`, not allocatable) are listed as `flexible` alongside the allocatable `instant` strategies."
# Every strategy's asset comes back as a display name (`BTC`) and is emitted as the
# internal id every other surface uses (`XXBT`), through the venue's own `Assets` join
# on `altname` -- see `[ids]`.

[support.report]
support = "full"
auth = true
note = "`history()` is the account ledger, one record per row: a spot trade is two `TradeLeg` rows sharing a `refid`, and `margin`/`adjustment`/`rollover`/`settled`/`sale`/`conversion`/`nft*` rows land as `UnknownObservation`. `snapshot()` is `Balance`, Earn balances included under their suffixed ids (`XXBT.F`)."
# ReportSDK never has a DEFAULT_ACCOUNTS entry for any venue.

[support.wallet]
support = "partial"
auth = true
methods = ["withdrawal_methods"]
note = "`deposit_methods` raises `NotImplementedError`: Kraken's `DepositMethods` answers one asset at a time with a method name (`Bitcoin Lightning`, `kBTC - Optimism (Unified)`) and no network field. `withdrawal_methods` maps `WithdrawMethods` fully, with Kraken's display network names (`Bitcoin`, `Arbitrum One`, a bank rail for fiat) and a flat fee per row."

[support.market]
support = "partial"
auth = false
methods = [
  "depth",
  "depth_stream",
  "rules",
  "fees",
  "tickers",
  "index",
  "perp_stats",
  "funding_rates",
  "candles",
  "query_order",
  "open_orders",
  "trades_history",
  "trades_stream",
  "position",
  "collateral",
  "available_notional",
]
note = "Spot retains its existing public/private reads; perp adds public non-tradfi USD linear perpetuals with unit contract size, including tokenized assets classified that way by Kraken. Perp supports discovery, depth, tickers, rules, index, perp_stats, funding_rates and all six candle intervals. Futures streams, next_funding, account fees and all private/trading methods remain unsupported. Spot candles retain the recent API window (documented 720; 721 observed including forming). Perp candles use trade Charts in bounded 2000-open windows, preserve missing intervals, and filter aware half-open bounds. Funding history uses native relativeFundingRate, with settlement time = native period start + 1 hour and inclusive/open bounds. Perp standard fees and maximum order size remain unknown; USD fee currency resolves through Assets to ZUSD."
# Spot depth_stream is supported; perpetual streams are explicitly unsupported.
# Public reads use the credential-free Kraken DEFAULT_ACCOUNTS entry.

[ids]
asset = "symbol"
market = "Spot REST pair altname (`XBTUSD`, `ETHUSDC`); perpetual instrument symbol (`PF_XBTUSD`, `PF_ETHUSD`) under exchange perp."
note = "Kraken's internal asset id (`XXBT`, `XETH`, `ZUSD`, `USDC`, `SOL`): what `Balance`, `Ledgers`, `TradesHistory`, `WithdrawMethods` and the default `AssetPairs`/`Assets` listings name assets by. `Earn/Strategies` answers in display names (`BTC`) and is re-keyed to the internal id through the venue's own `Assets` join on `altname`. Networks are Kraken's display network names (`Bitcoin`, `Arbitrum One`)."

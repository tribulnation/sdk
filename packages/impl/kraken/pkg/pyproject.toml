[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tribulnation-kraken"
version = "0.2.0"
authors = [
  {name="Marcel Claramunt", email="marcel@tribulnation.com"}
]
description = "Tribulnation SDK implementation for Kraken."
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "tribulnation-sdk>=2.0.0", "typed-kraken>=0.3.0"
]
requires-python = ">=3.10"
readme = {file="README.md", content-type="text/markdown"}

[project.urls]
Repository = "https://github.com/tribulnation/sdk.git"

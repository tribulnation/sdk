# auth = false means market data works on a credential-free (`public = true`) account;
# auth = true means every call needs a real accounts.Evedex() entry.

[support.market]
support = "partial"
auth = false
kinds = ["perp"]
methods = [
  "depth", "depth_stream", "rules", "fees", "candles", "tickers", "perp_stats",
  "query_order", "open_orders", "trades_history", "trades_stream", "position",
  "collateral", "available_notional", "remaining_position_limit", "collateral_id",
  "place_order", "place_orders", "cancel_order", "cancel_orders", "replace_order",
  "replace_orders", "cancel_open_orders", "index", "next_funding", "perp_position",
  "perp_collateral", "leverage", "set_leverage",
]
note = "USDT-margined perpetuals (`perp`) on the production exchange (evedex.com); the demo environment (evedex.io) is not a venue here: its instruments are other ids (`BTCUSD:DEMO`) and its trading balance cannot be funded through the API. Market ids are instrument names (`BTCUSD`); `markets()` lists the visible ones (`visibility: all`), and `rules().api` is false for those not open to every account (`marketMakerOnly`, a closed session or a stopped matcher). Public data needs no credentials; an API key serves every account read; the wallet's private key also signs orders (EIP-712) and opens the private fills stream. `rules()` carries the instrument's tick, step, quantity bounds, 5 USD minimum notional and standard fee rates; the accepted price range and the mark-price band (`markPriceLimit`) stay in `details`. `fees` is the account's rates (`tradingFees`, personal overrides first). `depth` and `depth_stream` serve the whole aggregated book, at most 100 levels a side, stamped with the venue's time; every stream publication is a full book. Tickers take last price and 24h volumes from one instrument read and the best bid and ask from one top-of-book request per market. Candles serve the six SDK intervals with base and USD volume. Funding is computed every 8 hours and settled hourly, a pro-rated eighth each hour (the venue's funding docs): `next_funding` and `perp_stats` report the next hourly settlement, `fundingRate / fundingRateInterval` at the next whole hour, positive when longs pay; no settlement has been observed on the account yet. `funding_rates` is not supported (no rate history is published) and neither is `funding_payments` (the account ledger's funding entries name no instrument). `index` is the base coin's `avgLastPrice` times `lotSize`. Orders are limit orders at the account's leverage on the instrument (the position record's, 1 where never set): `LIMIT` is good-till-cancelled, `POST_ONLY` adds `postOnly`, `MARKET` is an immediate-or-cancel limit at `price` (the venue's market order is sized in USD and bounded only by its slippage limit). Off-grid prices and sizes raise `ValueError` before signing. The venue processes orders asynchronously, so `filled_qty` is `None`. Order ids are chosen by the client (`DDDDD:<26 hex>`): `client_order_id` is sent as the order id, and fills report the order id as both. A refused placement raises `OrderRejected`; cancelling an unknown id `OrderNotFound`. `replace_order` is cancel then place; `cancel_open_orders` is the venue's per-instrument mass cancel. `trades_history` reads each page's order sides in one request and fees with one request per order; the fills stream carries no fee. Collateral is the account's one cross bucket, `<account>:perp`: equity is the trading balance plus unrealized PnL, free collateral the venue's `availableBalance`. `liquidation_price` is `None` (the venue publishes a bankruptcy price only). `remaining_position_limit` is the instrument's `leverageLimit` notional at the account's leverage, less the position held, at the mark; accounts with per-account leverage limits raise NotImplementedError. Market data and account reads are verified on mainnet (2026-11-19); placing, cancelling and leverage changes are pending a mainnet lifecycle run."
# Credential modes (ADR 0042). Public (`public = true`, no keys): market data only. An
# API key alone serves every account read below: a read-only token. The wallet's
# `private_key` adds orders, cancels and `trades_stream`.

[support.report]
support = "partial"
auth = true
methods = ["snapshot"]
note = "Snapshots of one account, with an API key: the trading balance (without unrealized PnL) and open positions by instrument name as `trading`, and the smart-account wallet's balances as `wallet` (read through the Exchange service's deprecated `balance`, the one an API key can read). Coins are the venue's (`usdt`). History is not supported."

[ids]
asset = "symbol"
market = "The instrument name (`BTCUSD`, `1000PEPEUSD`), the id every venue call takes."
note = "The one asset id is the venue's coin `usdt`, the collateral, fee and funding coin, written lowercase as the venue sends it."

# Release qualification of account reads (ADR 0042); not shown in the support matrix.
[qualification.market]
min_mode = "token"
token_methods = [
  "fees", "open_orders", "query_order", "trades_history", "position", "perp_position",
  "collateral", "perp_collateral", "leverage", "available_notional",
  "remaining_position_limit", "collateral_id",
]

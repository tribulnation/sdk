# auth = false means this surface has a real credential-free DEFAULT_ACCOUNTS entry —
# auth = true means every call always needs a real accounts.Bybit() entry.

[support.market]
support = "full"
auth = true
note = "`candles` serves every contract interval on spot and perp, in Bybit's native newest-first pages, filtered to the required `[start, end)` range."
# Bybit v5 is one API discriminated by `category`, so both exchanges
# run off one client. `perp` lists linear perpetuals only — the 40 dated `LinearFutures`
# contracts the same category carries pay no funding and settle on a delivery date, so
# nothing about the PerpMarket contract describes them.

[support.earn]
support = "full"
auth = true
note = "Covers fixed-term savings, flexible savings and on-chain staking. Hold-to-Earn and Dual Asset are left out: the first has no subscription, min/max or id to act against, the second quotes its yield only per product, never in the catalogue."
# All three catalogues are public, but the client still refuses to
# build without credentials unless `public=True` is passed, so `auth = true` holds.
# Two Earn lines stay unmapped on purpose: Hold-to-Earn has no subscription step,
# min/max stake or id to act against, and Dual Asset (Bybit's `one-time` analogue)
# carries no yield in its catalogue — only in a per-product quote call.

[support.wallet]
support = "full"
auth = true
# One authenticated call enumerates every coin/chain pair with fees,
# minimums, contract addresses and per-side availability. `DepositMethod.fee` is always
# `None`: Bybit charges no deposit fee and reports no field for one.

[support.report]
support = "partial"
auth = true
methods = ["snapshot", "history"]
note = "`history()` covers spot fills, linear funding settlements and crypto deposits/withdrawals. Derivatives fills and closed PnL, internal transfers, Earn events, bonus credits and fiat on/off-ramp are not covered, though Bybit exposes the endpoints."
# `snapshot()` is complete — the unified account is one pool, so a
# single SubaccountSnapshot covers it. `history()` covers spot fills, linear funding
# settlements, and crypto deposits/withdrawals; derivatives fills and closed PnL,
# internal UID-to-UID transfers, Earn subscribe/redeem events, bonus/airdrop credits and
# fiat on/off-ramp are not covered, though Bybit exposes the endpoints.

[ids]
asset = "symbol"
note = "The venue's coin name (`BTC`, `USDT`); market ids are concatenated pair symbols (`BTCUSDT`)."

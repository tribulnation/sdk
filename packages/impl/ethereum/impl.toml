# auth = false means this surface has a real credential-free DEFAULT_ACCOUNTS entry —
# auth = true means every call always needs a real accounts.Evm('ethereum') entry.

[support.report]
support = "full"
auth = true
note = "History needs an RPC/explorer provider (`ProvidersConfig`). Etherscan-backed `history()` is blocked: typed-etherscan requires `contractaddress` on the ERC-20/ERC-721 feeds, so token legs cannot be fetched account-wide and the source raises rather than yield a partial history (see `typed-client-issues.md`). Moralis history carries no NFT legs. HyperEVM is the `hyperevm` venue id; `hyperliquid` is the separate HyperCore account."
# ReportSDK never has a DEFAULT_ACCOUNTS entry for any venue — EVM history/snapshots don't
# need exchange credentials (just a real address), but the SDK still requires an explicit
# accounts.Evm() entry rather than a free default.

[ids]
asset = "address"
note = "`native` for the chain's own coin, else the checksummed ERC-20 contract address; one catalogue platform per chain (`ethereum`, `arbitrum`, ...)."

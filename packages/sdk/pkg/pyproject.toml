[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tribulnation-sdk"
version = "2.16.0"
authors = [
  {name="Marcel Claramunt", email="marcel@tribulnation.com"}
]
description = "An abstract, fully-typed, async Python SDK for automated crypto trading. By Tribulnation."
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "tribulnation-cli>=0.1.0,<1",
  "lazy-loader", "typing-extensions", "typed-core>=0.8.1",
  "tomli>=1.1.0; python_version < '3.11'",
]
requires-python = ">=3.10"
readme = {file="README.md", content-type="text/markdown"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.entry-points."tribulnation.commands"]
gateway = "tribulnation.sdk.gateway.cli:app"

[project.optional-dependencies]
gateway = ["aiohttp>=3.12,<4", "pydantic>=2,<3", "python-dotenv>=1,<2"]
aster = ["tribulnation-aster>=0.10.0"]
lighter = ["tribulnation-lighter>=0.9.0"]
mexc = ["tribulnation-mexc>=2.4.0"]
dydx = ["tribulnation-dydx>=0.14.0"]
hyperliquid = ["tribulnation-hyperliquid>=0.16.0"]
binance = ["tribulnation-binance>=0.7.0"]
bitget = ["tribulnation-bitget>=0.11.0"]
bit2me = ["tribulnation-bit2me>=0.9.0"]
ethereum = ["tribulnation-ethereum>=0.6.0"]
bybit = ["tribulnation-bybit>=0.7.0"]
coinbase = ["tribulnation-coinbase>=0.5.0"]
kraken = ["tribulnation-kraken>=0.7.0"]
kucoin = ["tribulnation-kucoin>=0.6.0"]
deribit = ["tribulnation-deribit>=0.6.0"]

[project.urls]
Github = "https://github.com/tribulnation/sdk.git"

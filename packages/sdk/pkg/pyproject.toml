[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tribulnation-sdk"
version = "4.1.0"
authors = [
  {name="Marcel Claramunt", email="marcel@tribulnation.com"}
]
description = "An abstract, fully-typed, async Python SDK for automated crypto trading. By Tribulnation."
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "tribulnation-cli>=0.1.0,<1",
  "lazy-loader", "typing-extensions", "typed-core>=0.8.1",
  "tomli>=1.1.0; python_version < '3.11'",
]
requires-python = ">=3.10"
readme = {file="README.md", content-type="text/markdown"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.entry-points."tribulnation.commands"]
gateway = "tribulnation.sdk.gateway.cli:app"

[project.optional-dependencies]
gateway = ["aiohttp>=3.12,<4", "msgspec>=0.19,<1", "python-dotenv>=1,<2"]
aster = ["tribulnation-aster>=0.15.0"]
extended = ["tribulnation-extended>=0.4.0"]
lighter = ["tribulnation-lighter>=0.14.0"]
margin-trade = ["tribulnation-margin-trade>=0.4.0"]
grvt = ["tribulnation-grvt>=0.4.0"]
nado = ["tribulnation-nado>=0.1.0"]
risex = ["tribulnation-risex>=0.1.0"]
mexc = ["tribulnation-mexc>=3.0.1"]
dydx = ["tribulnation-dydx>=0.21.1"]
hyperliquid = ["tribulnation-hyperliquid>=0.21.0"]
binance = ["tribulnation-binance>=0.9.0"]
bitget = ["tribulnation-bitget>=0.14.0"]
bit2me = ["tribulnation-bit2me>=0.10.1"]
ethereum = ["tribulnation-ethereum>=0.6.0"]
bybit = ["tribulnation-bybit>=0.10.0"]
coinbase = ["tribulnation-coinbase>=0.6.1"]
kraken = ["tribulnation-kraken>=0.9.0"]
kucoin = ["tribulnation-kucoin>=0.7.0"]
deribit = ["tribulnation-deribit>=0.7.0"]

[project.urls]
Github = "https://github.com/tribulnation/sdk.git"
